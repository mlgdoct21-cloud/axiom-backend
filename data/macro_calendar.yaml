# AXIOM Macro Intelligence — Manual release calendar
#
# Drives adaptive polling: when wall-clock is within ±30 min of an event's
# scheduled_at, every source listed in `sources_to_accelerate` polls every
# 10 s instead of its default cadence (see services/macro_calendar.py).
#
# CPI / NFP / PCE schedules now come from FRED's release/dates endpoint
# (services/macro_sources/fred_calendar.py) — DO NOT add them here, FRED
# is authoritative and your manual entry will overlap with the wrong date.
#
# Keep manual entries only for events FRED doesn't track:
#   - FOMC decisions (federalreserve.gov publishes its own schedule)
#   - Kalshi-related markets we want to accelerate around FOMC
#
# All times are UTC (ISO 8601 with offset).
# - FOMC decision: 18:00 UTC standard, 19:00 UTC after DST shifts (varies)

events:
  # --- 2026 FOMC schedule (federalreserve.gov; verify each cycle) ---
  - event_type: FOMC_DECISION
    label: "FOMC June 2026 Decision"
    scheduled_at: 2026-06-17T18:00:00Z
    sources_to_accelerate: [fed_rss, kalshi_fed]
  - event_type: FOMC_DECISION
    label: "FOMC July 2026 Decision"
    scheduled_at: 2026-07-29T18:00:00Z
    sources_to_accelerate: [fed_rss, kalshi_fed]
  - event_type: FOMC_DECISION
    label: "FOMC September 2026 Decision"
    scheduled_at: 2026-09-16T18:00:00Z
    sources_to_accelerate: [fed_rss, kalshi_fed]
  - event_type: FOMC_DECISION
    label: "FOMC October 2026 Decision"
    scheduled_at: 2026-10-28T18:00:00Z
    sources_to_accelerate: [fed_rss, kalshi_fed]
  - event_type: FOMC_DECISION
    label: "FOMC December 2026 Decision"
    scheduled_at: 2026-12-16T19:00:00Z   # post-DST, +1 UTC
    sources_to_accelerate: [fed_rss, kalshi_fed]
