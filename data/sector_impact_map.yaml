  mechanism: "Reel faiz baskısı banka marjlarını korur, faiz duyarlı sektörlere baskı"
  sectors_positive: [bist_banka, financials]
  sectors_negative: [bist_inşaat, bist_perakende, real_estate, growth_stocks]

TR_TUFE_COOL:
  description: "TÜFE soğuyor; TCMB faiz indirimi alanı genişliyor"
  mechanism: "Cut bekleyişi BIST'i destekler, USDTRY üzerindeki sertleşme baskısı azalır"
  sectors_positive: [bist_inşaat, bist_perakende, bist_holding, growth_stocks]
  sectors_negative: [bist_banka]

TR_CORE_TUFE_HOT:
  description: "Çekirdek-B yapışkan enflasyon; cut beklentisi geri çekiliyor"
