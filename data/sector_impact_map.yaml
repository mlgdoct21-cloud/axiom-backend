  sectors_positive: [bist_inşaat, bist_perakende, bist_holding, growth_stocks]
  sectors_negative: [bist_banka]

TR_UNRATE_UP:
  description: "İşsizlik yükseldi; iç talep zayıflıyor"
  mechanism: "TCMB cut baskısı artar; ama harcama kanalı daralır"
  sectors_positive: [bist_banka]
  sectors_negative: [bist_perakende, bist_inşaat, consumer_discretionary]

TR_UNRATE_DOWN:
  description: "İşsizlik düştü; iç talep güçlü"
  mechanism: "Tüketim güçlü ama enflasyon baskısı sürüyor"
  sectors_positive: [bist_perakende, bist_holding, consumer_discretionary]
