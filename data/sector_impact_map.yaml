# AXIOM Macro Intelligence — Sector Impact Whitelist v0
#
# Used by macro_narrative.py to constrain Gemini output. If a sector name in
# the LLM response is NOT present in the active category's lists, the response
# is rejected and the raw YAML is served instead.
#
# Sector keys must stay lowercase ASCII (used in chip rendering + i18n maps).
# Mechanism is a single-sentence rationale — kept terse to fit prompt budget.

CPI_HOT:
  description: "CPI prints above expectation; sticky inflation; rate-cut bets fade"
  mechanism: "Higher-for-longer rates compress duration assets and lift real yields"
  sectors_negative: [tech, growth_stocks, real_estate, consumer_discretionary, utilities]
  sectors_positive: [energy, financials, commodities, materials]

CPI_COOL:
  description: "CPI prints below expectation; disinflation extends; cut odds rise"
  mechanism: "Falling real yields rerate duration; risk-on into growth"
  sectors_positive: [tech, growth_stocks, real_estate, consumer_discretionary, utilities]
  sectors_negative: [energy, financials]

NFP_HOT:
  description: "Nonfarm payrolls beat strongly; wage growth firm; labour tight"
  mechanism: "Hot labour delays cuts; small caps and rate-sensitives bear the cost"
  sectors_negative: [small_caps, real_estate, utilities, growth_stocks]
  sectors_positive: [financials, industrials, consumer_discretionary]

NFP_COOL:
  description: "Nonfarm payrolls miss; unemployment ticks up; labour softens"
  mechanism: "Soft-landing trade revives; defensives and bonds bid"
  sectors_positive: [tech, growth_stocks, real_estate, utilities, consumer_staples]
  sectors_negative: [financials, energy, industrials]

FOMC_HAWKISH:
  description: "FOMC statement/dots more restrictive than priced; cuts pushed out"
  mechanism: "Dollar firms, real yields rise, equity risk premium compresses"
  sectors_negative: [tech, growth_stocks, real_estate, small_caps, em_exposure]
  sectors_positive: [financials, energy, defensives]

FOMC_DOVISH:
  description: "FOMC statement/dots more accommodative than priced; cuts pulled forward"
  mechanism: "Dollar softens, duration rallies, risk-on broadens"
  sectors_positive: [tech, growth_stocks, real_estate, small_caps, em_exposure, consumer_discretionary]
  sectors_negative: [financials, defensives]

PCE_HOT:
  description: "Core PCE above expectation; Fed's preferred gauge stays sticky"
  mechanism: "Equivalent to CPI_HOT with stronger Fed-policy weight"
  sectors_negative: [tech, growth_stocks, real_estate, consumer_discretionary]
  sectors_positive: [energy, financials, commodities]

PCE_COOL:
  description: "Core PCE undershoots; disinflation confirmed in Fed's gauge"
  mechanism: "Cut bets accelerate; duration assets lead"
  sectors_positive: [tech, growth_stocks, real_estate, consumer_discretionary]
  sectors_negative: [energy, financials]

# Core CPI / Core PCE — same sector logic as headline; the surprise here
# matters more for Fed policy because food/energy noise is stripped.
CORE_CPI_HOT:
  description: "Core CPI prints above expectation; underlying inflation sticky"
  mechanism: "Service-side inflation persists; rate-cut path delayed further"
  sectors_negative: [tech, growth_stocks, real_estate, consumer_discretionary, utilities]
  sectors_positive: [energy, financials, commodities, materials]

CORE_CPI_COOL:
  description: "Core CPI undershoots; underlying disinflation extends"
  mechanism: "Service-side cooling supports cut bets; duration leads"
  sectors_positive: [tech, growth_stocks, real_estate, consumer_discretionary, utilities]
  sectors_negative: [energy, financials]

CORE_PCE_HOT:
  description: "Core PCE above expectation; Fed's preferred gauge sticky"
  mechanism: "Highest Fed-policy weight; cuts pushed out more aggressively"
  sectors_negative: [tech, growth_stocks, real_estate, consumer_discretionary]
  sectors_positive: [energy, financials, commodities]

CORE_PCE_COOL:
  description: "Core PCE undershoots; Fed's preferred gauge confirms disinflation"
  mechanism: "Strongest dovish signal of all releases; risk-on into duration"
  sectors_positive: [tech, growth_stocks, real_estate, consumer_discretionary]
  sectors_negative: [energy, financials]

# === Day 28 part 3 — yeni veri kapsamı ===

# Initial Jobless Claims (haftalık) — düşük değer = sıkı işgücü = enflasyon riski
JOBLESS_LOW:
  description: "Initial claims below 4-week MA; labour market still tight"
  mechanism: "Tight labour delays Fed cuts; rate-sensitives bear the cost"
  sectors_negative: [small_caps, real_estate, utilities, growth_stocks]
  sectors_positive: [financials, industrials]

JOBLESS_HIGH:
  description: "Initial claims above 4-week MA; layoff trend rising"
  mechanism: "Soft labour boosts cut bets; defensives and duration lead"
  sectors_positive: [tech, growth_stocks, real_estate, utilities, consumer_staples]
  sectors_negative: [financials, energy, industrials]

# Retail Sales — yüksek = tüketici sağlam = ekonomi sıkı, faiz indirimi gecikir
RETAIL_HOT:
  description: "Retail sales beat; consumer resilient; soft-landing narrative weakens"
  mechanism: "Strong demand keeps inflation sticky, delays Fed cuts"
  sectors_negative: [small_caps, real_estate, utilities]
  sectors_positive: [consumer_discretionary, financials, industrials]

RETAIL_COOL:
  description: "Retail sales miss; consumer pullback signals"
  mechanism: "Soft consumer raises cut odds; duration bid"
  sectors_positive: [tech, growth_stocks, real_estate, utilities, consumer_staples]
  sectors_negative: [consumer_discretionary, financials]

# PPI — üretici enflasyonu, CPI öncülü
PPI_HOT:
  description: "PPI above expectation; pipeline inflation building"
  mechanism: "Wholesale price pressure feeds through to CPI; rate cuts deferred"
  sectors_negative: [tech, growth_stocks, real_estate, consumer_discretionary]
  sectors_positive: [energy, financials, commodities, materials]

PPI_COOL:
  description: "PPI undershoots; pipeline pressures easing"
  mechanism: "Pipeline disinflation supports CPI cooling thesis"
  sectors_positive: [tech, growth_stocks, real_estate, consumer_discretionary]
  sectors_negative: [energy, materials]

# Housing Starts — konut başlangıçları, faiz duyarlı
HOUSING_HOT:
  description: "Housing starts beat; construction resilient despite high rates"
  mechanism: "Sector strength supports broader cyclicals"
  sectors_positive: [real_estate, financials, materials, industrials]
  sectors_negative: []

HOUSING_COOL:
  description: "Housing starts miss; rate-sensitive sector weakening"
  mechanism: "Construction slowdown raises cut pressure on Fed"
  sectors_negative: [real_estate, financials, materials]
  sectors_positive: [tech, growth_stocks, consumer_staples]

# GDP — büyüme, çeyreklik
GDP_HOT:
  description: "GDP beats; economy growing above trend"
  mechanism: "Strong growth supports earnings + delays Fed cuts"
  sectors_positive: [financials, industrials, consumer_discretionary, energy]
  sectors_negative: [utilities, consumer_staples]

GDP_COOL:
  description: "GDP misses; growth slowing or contracting"
  mechanism: "Soft growth reignites recession risk; defensives + duration lead"
  sectors_positive: [tech, growth_stocks, utilities, consumer_staples, real_estate]
  sectors_negative: [financials, industrials, energy]
