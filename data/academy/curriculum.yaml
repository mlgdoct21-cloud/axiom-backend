# AXIOM Opsiyon Akademisi — Müfredat
#
# 4 modül, 16 ders. Türkçe sezgi dili + horology marka vokabüleri.
# Worked example her derste: kripto (BTC/ETH — Deribit) + ABD endeks (SPX/VIX).
#
# Kullanım:
# - services/academy_service.py bu dosyayı YAML olarak yükler.
# - glossary.yaml ile birlikte çalışır (glossary_refs slug bağı).
# - tier_required: free | premium | advance
# - Free kullanıcı M1 + glossary tamamı + diğerleri için 'M2-M4 🔒 Premium' teaser görür.
# - "Şunu al" dili YASAK; "şöyle işler" dili kullan (SPK eğitim çerçevesi).
# - Sayı/fiyat veren cümle YOK — sayılar runtime'da academy_context.py
#   (DVOL+VIX) ile "bugünkü canlı bağlam rozeti" olarak enjekte edilir;
#   ders gövdesinde sabit fiyat olmaz (halüsinasyon ve zaman aşımı koruması).

metadata:
  version: 1
  language: tr
  source_of_truth: "Statik insan-onaylı içerik"
  brand_voice: horology
  disclaimer: "Bu içerik EĞİTİM amaçlıdır. Yatırım tavsiyesi değildir (SPK)."
  greek_renaming:
    delta: "Fiyat Duyarlılığı"
    gamma: "Risk İvmesi"
    theta: "Zaman Kaybı Hızı"
    vega: "Volatilite Hassasiyeti"
    rho: "Faiz Hassasiyeti"

# ============================================================================
# MODÜL 1 — Opsiyon Nedir?
# Hak, yükümlülük ve sigorta sezgisi
# ============================================================================
modules:
  - id: M1
    slug: opsiyon-nedir
    title: "Opsiyon Nedir? — Hak, Yükümlülük ve Sigorta Sezgisi"
    tagline: "Mainspring kurulur — opsiyonun ömrü başlar."
    tier_required: free
    summary: |
      Opsiyon, bir hisseyi veya kriptoyu belirli bir fiyattan, belirli bir tarihe
      kadar ALMA veya SATMA HAKKI'dır. Hak — yükümlülük değil. Bu modül call/put
      ayrımını, sözleşmenin anatomik parçalarını ve neden opsiyon kavramının
      sigorta sezgisiyle anlaşılması gerektiğini kurar.
    duration_min: 18
    lessons:

      - id: M1L1
        slug: hak-vs-yukumluluk
        title: "Hak Almak mı, Yükümlülük Üstlenmek mi?"
        learning_objective: "Call/put ayrımını ve 'alıcı vs satıcı' rollerini sezgisel olarak ayırt etmek."
        body: |
          Bir yangın sigortasını düşün. Sigortayı ALAN kişi her yıl küçük bir
          prim öder. Evi yanarsa şirket büyük zararı karşılar; yanmazsa ödediği
          prim "gider" olur ama içi rahattır. Sigortayı SATAN şirket ise primi
          peşin cebine koyar — ama ev gerçekten yanarsa ödemeyi yapmak zorundadır.

          Opsiyon piyasası tam da böyle çalışır: bir tarafta hak ALAN, diğer
          tarafta hak SATAN vardır.

          Diyelim ki Mehmet bir varlığın yükseleceğine inanıyor. Bir "call"
          alır — yani "bunu şu fiyattan alma hakkı"nı satın alır ve karşılığında
          prim öder. Hak onundur; kullanmak zorunda değildir. Zeynep ise bir
          düşüşten korkuyor; elindeki varlığı korumak için bir "put" alır, yani
          "şu fiyattan satma hakkı". O da tıpkı sigorta gibi prim öder.

          Peki bu primi kim alıyor? Karşı taraftaki SATICI. Satıcı primi peşin
          tahsil eder ama bir yükümlülük üstlenir: alıcı hakkını kullanmak
          isterse, onun karşısında durmak zorundadır.

          Tek cümlelik sezgi: opsiyon ALICISI sigortayı yaptıran kişidir, opsiyon
          SATICISI ise sigorta şirketidir. Biri hak alır ve öder; diğeri
          yükümlülük üstlenir ve tahsil eder.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC tutuyorsun ve "bir ay içinde sert düşüş riski var" diye düşünüyorsun.
              Bir put alıyorsun — strike bugünkü spotun biraz altında. Prim ödüyorsun.
              Düşerse, sigorta devreye girer ve kaybın tabandan durur. Düşmezse
              prim erir — yangın çıkmadığında sigorta priminin yanması gibi.
          - asset: us_index
            symbol: SPX
            scenario: |
              Portföyün ağırlıklı S&P 500 ETF'i. FOMC haftası yaklaşıyor.
              SPX üzerine put alıyorsun. Eğer Fed şahinleşir ve endeks sert
              düşerse, put primin fırlar ve portföy kaybını telafi eder.
              Eğer hiçbir şey olmazsa primi zaman içinde kaybedersin.
        horology_link: mainspring
        horology_note: "Mainspring kuruldu — opsiyon ömrü başladı. Vadeye kadar enerji boşalmaya başlar."
        quiz:
          question: "Bir trader 100 hisse Apple'ı korumak için protective put alıyor. Hangisi doğru?"
          options:
            - text: "Trader put SATTI, prim tahsil etti."
              correct: false
              feedback: "Hayır — koruma için put ALINIR, prim ÖDENİR. Satan tarafta yükümlülük olur."
            - text: "Trader put ALDI, prim ödedi. Düşüşe karşı sigortalandı."
              correct: true
              feedback: "Doğru. Protective put portföyün sigortasıdır; alıcı prim öder, alttan tabela alır."
            - text: "Trader call sattı."
              correct: false
              feedback: "Hayır — call satmak farklı bir strateji (covered call). Bu put alımıyla ilgili."
        glossary_refs: [call, put, prim, exercise]

      - id: M1L2
        slug: strike-vade-prim
        title: "Sözleşmenin Anatomisi: Strike, Vade, Prim"
        learning_objective: "Bir opsiyon kontratının üç temel parametresini ve aralarındaki ilişkiyi tanımak."
        body: |
          Bir opsiyonu bir bilete benzetelim. Her biletin üç bilgisi vardır:
          hangi fiyat, hangi tarihe kadar ve kaça aldın.

          Diyelim ki Can bir opsiyon "bileti" alıyor:

          1) STRIKE (kullanım fiyatı): biletin üzerindeki referans fiyat. Vade
             gününde "spot bu seviyenin neresinde?" diye buna bakılır.
          2) VADE: biletin son geçerlilik tarihi. Bunu kurulmuş bir saat yayına
             benzet — vadeye kadar her gün yay biraz daha boşalır.
          3) PRİM: bileti almak için ödenen bedel; anlık piyasa fiyatıdır.

          Bu üçü birbirine bağlıdır. Vade uzaksa ve piyasa çok oynuyorsa (IV
          yüksek) bilet pahalıdır. Vade yaklaştıkça ya da piyasa sakinleştikçe
          biletin değeri erir.

          Bir de gizli bir tuzak var: kontrat büyüklüğü. ABD hisse/endeks
          opsiyonunda 1 kontrat = 100 hisse. Deribit'te 1 BTC opsiyonu = 1 BTC.
          Acemilerin en sık hatası bu ölçeği karıştırmaktır — "1 kontrat"
          sandığından çok daha büyük bir pozisyon olabilir.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              Deribit'te 30 günlük ETH call: strike biraz OTM, prim küçük bir
              ETH miktarı. 1 kontrat = 1 ETH'lik pozisyon. Vade yaklaştıkça
              prim her gün eriyecek (Theta çalışıyor).
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX üzerinde 45 günlük bir put: strike spot'un %5 altında.
              1 kontrat = 100 birim SPX. Prim bugünkü piyasa fiyatından
              alınır; vade boyunca theta erimesine maruz kalır.
        horology_link: mainspring
        horology_note: "Vade = mainspring'in tam sarımı. Her gün biraz boşalır."
        quiz:
          question: "Aynı strike'ta iki call var: biri 7 günlük, diğeri 90 günlük. Hangisinin primi daha yüksektir?"
          options:
            - text: "7 günlük — kısa vade olduğu için daha pahalı."
              correct: false
              feedback: "Tersine — uzun vade daha yüksek zaman değeri taşır. Mainspring daha çok sarılı."
            - text: "90 günlük — zaman değeri daha yüksek."
              correct: true
              feedback: "Doğru. Vade uzun ise mainspring'de daha çok enerji var, prim daha pahalı (varsayım: IV aynı)."
            - text: "İkisi de aynı çünkü strike aynı."
              correct: false
              feedback: "Hayır — strike aynı olsa bile vade primi belirleyen kritik bir parametredir."
        glossary_refs: [strike, vade, prim, kontrat-buyuklugu, zaman-degeri]

      - id: M1L3
        slug: itm-atm-otm
        title: "İçeride, Yanında, Dışarıda: ITM / ATM / OTM"
        learning_objective: "Opsiyonun spot'a göre konumunu ve bu konumun zaman değeri/içsel değer üzerindeki etkisini ayırt etmek."
        body: |
          Bir opsiyonun spot fiyata göre "nerede durduğunu" anlatan üç kelime
          var. Bunları bir hedefe atılan ok gibi düşün.

          Diyelim ki Selin'in elinde bir call var:

          - ITM (İçeride): ok tam isabet — şu an kullanılsa para kazandırır.
            Call için spot strike'ın üstündedir. İçinde gerçek (içsel) değer
            olduğu için pahalıdır.
          - ATM (Yanında): ok tam ortada — spot ile strike eşit. Burası en
            hassas noktadır; küçük bir kıpırtı bile fiyatı en çok burada oynatır.
          - OTM (Dışarıda): ok hedefin dışında — şu an kullanılsa sıfır eder.
            Sadece "belki ileride tutar" umudunu (zaman değeri) taşır. Ucuzdur
            ama çoğu zaman boşa düşer.

          Klasik yanılgı şudur: "OTM ucuz, az parayla çok kazandırır." Doğru ama
          tehlikeli. OTM opsiyonların büyük kısmı değersiz biter — tıpkı piyango
          bileti gibi: nadiren büyük, çoğu zaman sıfır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC spot belli bir seviyede. Aynı vadede üç call:
              strike spot'un %5 altında (ITM — pahalı, içsel değer var),
              strike spot'a eşit (ATM — Risk İvmesi yüksek),
              strike spot'un %10 üstünde (OTM — ucuz ama 'patlamadan' biter).
              ATM'de bir BTC hareketi prim üzerinde en sert etkiyi yapar.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX put: OTM put (strike spot'un %10 altında) ucuzdur ve
              normal piyasada genelde sıfır değerli biter. Ama VIX zıplarsa
              ya da sert düşüş gelirse Vega ve Delta birlikte primi fırlatır.
              Bu yüzden "ucuz portföy sigortası" olarak kullanılır.
        horology_link: balance-wheel
        horology_note: "ATM'de balance wheel en hassas; küçük titreşim büyük zıplama."
        quiz:
          question: "Spot 100. Bir call'ın strike'ı 105. Bu call hangi pozisyondadır?"
          options:
            - text: "ITM — şu an kullanılsa kâr ettirir."
              correct: false
              feedback: "Hayır — şu an kullanılırsa spot 100 < strike 105, kullanmaya değmez. OTM."
            - text: "ATM — strike spot'a yakın."
              correct: false
              feedback: "Yakın ama tam değil. ATM 'tam strike = spot' anlamına gelir."
            - text: "OTM — şu an kullanılsa sıfır değerli."
              correct: true
              feedback: "Doğru. Spot < strike olduğu için call OTM'dir; içsel değeri sıfır, sadece zaman değeri taşır."
        glossary_refs: [itm, atm, otm, icsel-deger, zaman-degeri, gamma]

      - id: M1L4
        slug: sigorta-vs-spekulasyon
        title: "Neden Var? Sigorta mı, Spekülasyon mu?"
        learning_objective: "Opsiyonun iki temel kullanım amacını ayırt etmek ve hedge kültürünün neden 'sigorta' tarafında olduğunu anlamak."
        body: |
          Opsiyonlar aslında iki çok farklı insan tarafından, iki çok farklı
          amaçla kullanılır.

          Birincisi SİGORTACI. Diyelim ki Emre'nin elinde değerli bir varlık var
          ve önünde belirsiz bir hafta duruyor (FOMC, bir borsa olayı). Bir put
          alıp kendini alttan sigortalar. Felaket gelmezse ödediği prim erir —
          ama bu bir başarısızlık değildir. Tıpkı "evim yanmadı, sigorta primim
          boşa gitti" demek gibi: aslında korunmuş ve içi rahat etmiştir.

          İkincisi SPEKÜLATÖR. Elinde varlık yokken, sırf "bir hafta içinde
          patlar" diyerek ucuz bir OTM opsiyon alır. Tutarsa büyük kazanır; çoğu
          zaman sıfırlanır. Bu bir bahistir.

          AXIOM Akademisi'nin felsefesi nettir: opsiyonu önce SİGORTA olarak
          öğren. Çünkü spekülasyon kazandığında sana bir şey öğretmez,
          kaybettiğinde ise yıkar. Sigorta ise her zaman öğreticidir.

          Türk piyasasında en yaygın hata, opsiyonu sadece "kaldıraçlı bahis"
          sanmaktır. Oysa opsiyon tarihte tam tersi için doğdu: çiftçinin hasat
          fiyatını önceden garantilemesi, yani korunması için.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              Hedge örneği: 1 BTC tutuyorsun, FOMC haftası yaklaşıyor.
              %5 OTM put alıyorsun. Düşerse sigorta devrede; düşmezse
              prim erir ama portföyünün geri kalanı zaten kazanmış olur.
              Bu, primin 'eridiğinde başarılı' olduğu bir işlemdir.
            spekulasyon_karsiti: |
              Spekülasyon örneği: 1 BTC tutmuyorsun ama "1 hafta içinde
              patlama olacak" diyerek %20 OTM call alıyorsun. Çoğu zaman
              sıfırlanır; nadiren patlar. Bu sigorta değil, bahis.
          - asset: us_index
            symbol: SPX
            scenario: |
              Hedge örneği: portföyün ağırlıklı endeks ETF'i. Yıl sonu
              tatil likidite düşüklüğünden önce 3 aylık SPX OTM put
              alıyorsun. Sigortacı gibi davranıyorsun — başına bir şey
              gelmezse mutlu, gelirse korunmuş.
        horology_link: escapement
        horology_note: "Sigortanın değeri 'tıkırtının' değerinde — küçük, düzenli, sessiz."
        quiz:
          question: "Hangisi hedge kültürünün TEMEL anlayışıdır?"
          options:
            - text: "Opsiyonla küçük parayla büyük kazanmak."
              correct: false
              feedback: "Bu spekülasyon. Hedge kültürü 'kazanmak' değil 'korunmak' üzerine kuruludur."
            - text: "Prim 'kaybedildiğinde' aslında sigorta görevini yapmış demektir."
              correct: true
              feedback: "Doğru. Yangın çıkmadıysa sigorta primi 'kayıp' değil, başarılı korunmadır."
            - text: "Opsiyon kesin kâr veren bir araçtır."
              correct: false
              feedback: "Kesin kâr veren bir finansal araç yoktur. Opsiyon, riski transfer eder."
        glossary_refs: [protective-put, prim, theta]

  # ==========================================================================
  # MODÜL 2 — Fiyatı Ne Belirler?
  # Zaman, volatilite ve mainspring'in boşalması
  # ==========================================================================
  - id: M2
    slug: fiyati-ne-belirler
    title: "Fiyatı Ne Belirler? — Zaman ve Volatilite"
    tagline: "Mainspring boşalır, escapement tıkırdar — Theta çalışır."
    tier_required: premium
    summary: |
      Opsiyonun primi tek bir şeyden gelmez. İki ana güç var: zaman değeri
      (mainspring'in henüz boşalmamış enerjisi) ve volatilite (piyasanın 'ne
      kadar oynar' beklentisi). Bu modül Theta ve Vega'nın sezgisini, IV'nin
      ne anlama geldiğini ve kripto için DVOL, ABD için VIX'in nasıl okunduğunu
      kurar.
    duration_min: 22
    lessons:

      - id: M2L1
        slug: icsel-zaman-degeri
        title: "Primin İki Bileşeni: İçsel Değer + Zaman Değeri"
        learning_objective: "Bir opsiyon primini içsel değer ve zaman değerine ayırmak."
        body: |
          Bir opsiyonun fiyatını (primi) ikiye böl, her şey netleşir:

          PRİM = İÇSEL DEĞER + ZAMAN DEĞERİ

          İçsel değeri "şu an cebimde ne var?" diye düşün. Diyelim ki Deniz'in
          bir call'u var ve spot strike'ın üstünde — opsiyonu hemen kullansa
          kazanacağı tutar işte bu içsel değerdir. Spot strike'ın altındaysa
          içsel değer sıfırdır (eksiye inmez).

          Zaman değeri ise "gelecekteki umut"tur — saatin henüz boşalmamış yayı.
          Vadeye ne kadar çok zaman varsa, fiyatın lehe dönme şansı o kadar
          fazladır; dolayısıyla zaman değeri de o kadar büyüktür.

          OTM opsiyonların primi tamamen zaman değeridir (içsel değer sıfır).
          ATM opsiyonlarda zaman değeri en yüksektir — çünkü yay tam dolu, hangi
          yöne boşalacağı en belirsiz andır.

          Vade yaklaştıkça zaman değeri sıfıra koşar. Hiçbir şey değişmese, fiyat
          hiç kıpırdamasa bile opsiyon her gün biraz erir. Bu erimenin adı
          Theta — ki sıradaki dersin konusu odur.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              Spot belli bir seviyede. Aynı vadede üç call:
              ITM call: prim = içsel değer + küçük zaman değeri.
              ATM call: prim = sıfır içsel + en yüksek zaman değeri.
              OTM call: prim = sıfır içsel + azalan zaman değeri.
              Vadeye yaklaşınca zaman değeri komponentinin nasıl eridiğini izle.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX put: vadeye 60 gün, strike %5 OTM. Primin tamamı zaman
              değeri. Vade 30 güne indiğinde, hiçbir şey değişmese bile
              prim ciddi şekilde erimiş olur — bu Theta'nın işidir.
        horology_link: mainspring
        horology_note: "İçsel değer = 'şu an' parası. Zaman değeri = mainspring'in geleceği."
        quiz:
          question: "Spot 100, call strike 90, prim 12. İçsel değer ve zaman değeri sırasıyla?"
          options:
            - text: "İçsel 10, zaman 2."
              correct: true
              feedback: "Doğru. Spot 100 - strike 90 = 10 içsel; prim 12 - içsel 10 = 2 zaman değeri."
            - text: "İçsel 12, zaman 0."
              correct: false
              feedback: "Hayır — içsel değer max(spot-strike,0) = 10, prim 12 olduğu için kalan 2 zaman değeridir."
            - text: "İçsel 0, zaman 12 (çünkü ITM)."
              correct: false
              feedback: "Tersine — ITM olduğu için içsel değer SIFIRDAN BÜYÜK olmalı."
        glossary_refs: [icsel-deger, zaman-degeri, prim, atm, theta]

      - id: M2L2
        slug: theta-zaman-kaybi
        title: "Theta — Zaman Kaybı Hızı (Saat Çarkı)"
        learning_objective: "Theta'nın ne olduğunu, vadeye giderken neden hızlandığını ve hangi pozisyonun düşmanı/dostu olduğunu kavramak."
        body: |
          Opsiyonu kurulu bir cep saati gibi düşün. Yay sarılıyken saat çalışır;
          her tıkırtıda yay biraz daha boşalır. Theta işte bu boşalmanın hızıdır
          — AXIOM dilinde "Zaman Kaybı Hızı". Yani opsiyonun değerinden her gün
          ne kadar erir.

          Diyelim ki Mehmet bir opsiyon ALDI. Theta onun düşmanıdır: piyasa hiç
          kıpırdamasa bile her sabah uyandığında pozisyonu biraz daha küçülmüş
          olur. Karşı tarafta opsiyonu SATAN kişi içinse Theta bir dosttur — her
          gün kira toplar gibi prim kazanır.

          Önemli bir incelik: bu erime düz bir çizgi değildir. Vadeye yaklaştıkça
          hızlanır; son hafta en serttir. Saatin yayı bitmeye yakın escapement
          daha hızlı tıkırdar. Buna "theta hızlanması" denir. ATM opsiyonlarda
          theta en yüksektir.

          Bu yüzden son birkaç günlük OTM opsiyon almak çoğu zaman kaybeden bir
          iştir: hem theta yüksektir hem de günden güne hızlanır. Elindeki bilet,
          sen hiçbir şey yapmasan bile, her saat biraz daha değer kaybeder.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              Deribit'te 7 günlük ATM ETH call. Hiçbir şey olmasa bile her
              gün primin ~%10-15'i theta yüzünden buharlaşır. 7. günün
              sonunda tüm zaman değeri sıfırlanmış olur. Bu, mainspring'in
              tam boşalmasıdır.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX vade haftası (OPEX): aynı strike'ta vadeye 30 gün kalan
              put ile 3 gün kalan putun theta'sı dağlar kadar farklıdır.
              3 günlük put 'lottery ticket' gibidir — kazanırsa büyük,
              kaybederse hızlı sıfır.
        horology_link: escapement
        horology_note: "Escapement tıkırtısı = theta erimesi. Vadeye yaklaştıkça beat rate hızlanır."
        quiz:
          question: "Aynı strike, aynı IV. Vade 60 gün vs vade 7 gün. Theta'nın gün başı kaybı hangisinde daha yüksektir?"
          options:
            - text: "60 günlük — daha çok zaman değeri olduğu için daha çok kayıp."
              correct: false
              feedback: "Mantıklı görünür ama yanlış. Theta vadeye yaklaştıkça hızlanır; 7 günlüğün günlük kaybı oransal olarak çok daha yüksek."
            - text: "7 günlük — vadeye yakın olduğu için günlük erime hızlanır."
              correct: true
              feedback: "Doğru. Theta non-linear — son haftada keskin ivmelenir."
            - text: "İkisi aynı çünkü strike aynı."
              correct: false
              feedback: "Strike aynı olsa bile vade theta'yı dramatik şekilde etkiler."
        glossary_refs: [theta, mainspring, escapement, beat-rate, zaman-degeri]

      - id: M2L3
        slug: implied-volatility
        title: "Implied Volatility — Piyasanın Beklentisi (DVOL ve VIX)"
        learning_objective: "IV kavramını ve kripto için DVOL, ABD için VIX'in nasıl okunduğunu kavramak."
        body: |
          Aynı vade, aynı strike, iki ayrı gün — ama opsiyonun fiyatı çok farklı.
          Neden? Cevap volatilite beklentisinde gizli.

          Implied Volatility (IV), opsiyon fiyatının ima ettiği "piyasa
          önümüzdeki dönemde ne kadar oynar?" beklentisidir. Dikkat:
          gerçekleşen değil, BEKLENEN oynaklık. Piyasa fırtına bekliyorsa primler
          kabarır; sakinlik bekliyorsa primler ucuzlar.

          İki önemli "korku göstergesi" vardır:
          - VIX, ABD piyasasının korku endeksidir (S&P 500 opsiyonlarından
            hesaplanır). Kabaca: 14 altı sakin, 14-20 normal, 20-30 endişeli,
            30 üstü panik. Bunlar kesin sınır değil, rejim okumak içindir.
          - DVOL ise kriptonun VIX'idir — Deribit'in BTC/ETH için hesapladığı IV
            endeksi. Kripto yapısı gereği daha oynak olduğundan DVOL genelde
            VIX'in birkaç katı geniştir.

          Sezgi şudur: IV yüksekken opsiyon ALMAK pahalıdır, SATMAK avantajlı; IV
          düşükken tam tersi — almak ucuz, satmak az kazandırır. "Sigortayı
          yangın çıkmadan, ucuzken al" mantığı tam olarak buradan gelir.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC DVOL yüksek bir rejimde: BTC opsiyon primleri tarihsel
              ortalamanın üstünde. Sigorta (put) pahalı; ama sigorta SATMAK
              (covered call yazmak) cazip prim toplar. DVOL düştüğünde tersi:
              put almak ucuz, satmak az kazandırır.
          - asset: us_index
            symbol: SPX
            scenario: |
              VIX 12'ye yakın bir dönem (sakin) → SPX put primleri çok
              ucuz, "portföy sigortası" almak için iyi pencere. VIX 30
              üstünde (panik) → opsiyonlar pahalı, sigorta sonradan
              alınması mantıksız (yangın başladıktan sonra sigorta).
        horology_link: balance-wheel
        horology_note: "IV = balance wheel'in salınım genişliği. Geniş salınım = pahalı saat (pahalı opsiyon)."
        quiz:
          question: "VIX 14'ten 28'e fırlıyor. Mevcut SPX put primlerine ne olur (diğer her şey sabit)?"
          options:
            - text: "Düşer — fiyat hareket etmediği sürece prim değişmez."
              correct: false
              feedback: "Hayır — IV değiştiğinde Vega yoluyla prim doğrudan değişir, fiyat hareket etmese bile."
            - text: "Fırlar — IV artışı Vega yoluyla primi şişirir."
              correct: true
              feedback: "Doğru. VIX'in iki katına çıkması Vega kanalıyla put primlerini ciddi şekilde yükseltir."
            - text: "Değişmez — IV sadece teorik bir endekstir, fiyatı etkilemez."
              correct: false
              feedback: "Tersine — IV opsiyon fiyatının ana girdilerinden biridir."
        glossary_refs: [implied-vol, dvol, vix, vega, iv-rank]

      - id: M2L4
        slug: vega-volatilite-hassasiyeti
        title: "Vega — Volatilite Hassasiyeti"
        learning_objective: "Vega'nın ne olduğunu, hangi vadede daha güçlü olduğunu ve neden uzun vadeli opsiyonların 'volatilite oynamak' için kullanıldığını kavramak."
        body: |
          Bazen fiyat hiç kıpırdamaz ama opsiyonun değeri yine de değişir. Bunu
          yapan şey Vega — AXIOM dilinde "Volatilite Hassasiyeti". Yani IV bir
          puan değişirse primin ne kadar oynayacağı.

          Diyelim ki Zeynep uzun vadeli bir opsiyon aldı. Spot bir ay boyunca
          aynı yerde saydı, ama bu sürede piyasa gerildi ve VIX (kriptoda DVOL)
          fırladı. Zeynep hiç yön tutturmadan kazandı — çünkü Vega çalıştı. Bazı
          yatırımcılar zaten yön bahsi yapmaz; sadece "volatilite artacak ya da
          azalacak" diye pozisyon alır.

          Vega'nın karakteri:
          - Uzun vadeli opsiyonlarda yüksektir (yay uzun, IV değişimine maruz
            kalma süresi fazla).
          - Kısa vadelilerde düşüktür.
          - ATM'de en yüksektir.

          Buradan güzel bir kural çıkar: 7 günlük opsiyonla yön/hareket bahsi
          yaparsın (Gamma baskın); 6 aylık opsiyonla volatilite bahsi yaparsın
          (Vega baskın). Saat metaforunda Vega, balance wheel'in sıkılığıdır —
          onu değiştirirsen saatin tüm temposu değişir.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              Spot 1 ay sabit kalsa bile, DVOL 50'den 80'e çıkarsa long
              ETH opsiyon pozisyonların Vega yoluyla değer kazanır. Bu,
              "ETH fiyatı hareket etmedi ama ben kazandım" durumudur —
              Vega çalıştı.
          - asset: us_index
            symbol: SPX
            scenario: |
              VIX 12'ye düşmüş, çok sakin piyasa. Bir trader 6 aylık SPX
              ATM straddle alıyor — yön bahsi değil, "VIX bu seviyede
              kalamaz, fırlayacak" Vega bahsi. VIX 25'e çıkarsa straddle
              primi şişer, kazanır.
        horology_link: balance-wheel
        horology_note: "Vega = balance wheel'i sıkmak/gevşetmek. Saat hızını tamamen değiştirir."
        quiz:
          question: "Bir trader uzun vadeli ATM SPX call alıyor. Hangi senaryo onun için EN İYİ?"
          options:
            - text: "Spot biraz yükseliyor + VIX biraz düşüyor."
              correct: false
              feedback: "Delta kazanır ama Vega kaybeder — net belirsiz veya küçük."
            - text: "Spot sabit + VIX sert yükseliyor."
              correct: true
              feedback: "Uzun vadeli ATM call yüksek Vega taşır; VIX fırlaması doğrudan primi şişirir."
            - text: "Spot büyük düşüş + VIX düşüş."
              correct: false
              feedback: "Hem Delta hem Vega aleyhine — en kötü senaryo."
        glossary_refs: [vega, implied-vol, vix, dvol, balance-wheel]

  # ==========================================================================
  # MODÜL 3 — Yunanlılar (Greeks) — Sezgi, formül yok
  # ==========================================================================
  - id: M3
    slug: greeks-sezgi
    title: "Yunanlılar (Greeks) — Sezgi, Formül Yok"
    tagline: "Saatin parçalarını adlandır."
    tier_required: premium
    summary: |
      Greeks, opsiyonun risk parmak izidir. Bu modülde Delta (Fiyat
      Duyarlılığı), Gamma (Risk İvmesi) ve M2'den hatırladığımız Theta +
      Vega'yı tek bir saatin parçaları olarak bağlıyoruz. Formül yok —
      sadece "balance wheel nasıl çalışıyor" sezgisi.
    duration_min: 20
    lessons:

      - id: M3L1
        slug: delta-fiyat-duyarliligi
        title: "Delta — Fiyat Duyarlılığı (ve Gizli Hedge Oranı)"
        learning_objective: "Delta'nın iki anlamını anlamak: (1) primin spot hareketine duyarlılığı, (2) eşdeğer pozisyon büyüklüğü."
        body: |
          Delta'yı — AXIOM dilinde "Fiyat Duyarlılığı" — bir arabanın hız
          göstergesi gibi düşün. İki şeyi birden anlatır.

          Birincisi DUYARLILIK: spot bir birim hareket ederse primin ne kadar
          oynayacağı. İkincisi, daha az bilinen ama çok kullanışlı olanı: HEDGE
          ORANI, yani opsiyonun kaç birim varlığa eşdeğer olduğu.

          Delta'nın aralığı şöyle:
          - Call için 0 ile +1, put için -1 ile 0 arasında.
          - ATM call yaklaşık +0.50; ATM put yaklaşık -0.50.
          - Derin ITM call ~+0.95 — neredeyse hisse gibi davranır.
          - Uzak OTM call ~+0.05 — neredeyse parasız.

          Diyelim ki Can'ın elinde 100 hisse var ve korunmak istiyor. 0.30
          delta'lı bir put alırsa, her put yaklaşık 30 hisselik koruma getirir;
          3-4 put portföyü ciddi ölçüde nötralize eder. "Delta hedging" dediğimiz
          şeyin özü budur.

          Sık karşılaşılan bir yanılgı: "Delta = opsiyonun kârla bitme olasılığı."
          Yaklaşık doğrudur ama kesin değildir — Delta'yı kesin bir olasılık
          değil, bir hisse-eşdeğer risk ölçüsü olarak oku.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              1 BTC tutuyorsun. -0.30 delta'lı bir put alıyorsun. Bu, BTC
              pozisyonun %30'unu nötralleştirir. -0.50 delta'lı (ATM) put
              alırsan %50'sini. -1 delta'lı (derin ITM) put alırsan
              tamamını — ama o noktada artık put değil, kısa BTC.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX portföyün var. -0.10 delta'lı OTM put = ucuz tail-risk
              sigortası, 'felaket' karşı korur ama normal düşüşte az
              etkilidir. -0.50 delta'lı ATM put = pahalı ama her düşüşte
              hemen tepki verir.
        horology_link: balance-wheel
        horology_note: "Delta = kadran ibresi. Şu anki konum, şu anki yön."
        quiz:
          question: "100 hisse Apple tutuyorsun. Tam delta-nötr olmak için -1 delta put gerekir. Eldeki put'un delta'sı -0.40. Kaç put gerekir?"
          options:
            - text: "1 put yeter."
              correct: false
              feedback: "Hayır. 1 put = 100 hisse kontrat büyüklüğü × 0.40 delta = 40 hisse eşdeğeri. Yetmez."
            - text: "2.5 put gerekir."
              correct: true
              feedback: "Doğru. -0.40 × 2.5 = -1.0 delta = 100 hisse nötr. (Pratikte 2 veya 3 put alınır.)"
            - text: "10 put gerekir."
              correct: false
              feedback: "Çok fazla — bu pozisyonu over-hedge eder, net kısa yapar."
        glossary_refs: [delta, atm, otm, itm, protective-put]

      - id: M3L2
        slug: gamma-risk-ivmesi
        title: "Gamma — Risk İvmesi (Delta'nın Hızlanması)"
        learning_objective: "Gamma'nın 'delta'nın değişim hızı' olduğunu ve neden ATM + kısa vadede en yüksek olduğunu kavramak."
        body: |
          Önceki derste Delta'yı arabanın hızına benzettik. Gamma — AXIOM dilinde
          "Risk İvmesi" — gaz pedalına basma hızıdır: Delta'nın ne kadar çabuk
          değiştiği. Gamma yüksekse, küçük bir spot hareketi bile Delta'yı sert
          şekilde değiştirir.

          Gamma'nın karakteri:
          - ATM ve kısa vadede en yüksektir. Burası piyasa yapıcının kabusudur.
          - Derin ITM veya uzak OTM'de düşüktür (Delta ya 1'e ya 0'a yapışmıştır).
          - Uzun vadede daha düşüktür (yay uzun, ani değişim seyrek).

          Bunun iki pratik yansıması var. Diyelim ki piyasa yapıcı kısa gamma
          pozisyonda. Fiyat yukarı koşunca Delta'sı hızla büyür ve daha çok hisse
          almak zorunda kalır — böylece fiyatı kendisi yukarı iter. Buna "gamma
          squeeze" denir; kurumsal akış analizinin (ileride Faz 4) temelidir.

          Öte yandan long gamma pozisyon (opsiyon ALAN), hareket hangi yöne
          olursa olsun kazanır — ama karşılığında theta öder. İşte klasik denge:
          opsiyon SATMAK (kısa gamma + uzun theta) sakin piyasada para basar, ama
          sert bir hareket bir gecede haftaların primini silebilir. "Bir lira
          kazan, on lira kaybet" riski budur.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              Vade gününe 2 gün kalmış ATM ETH call: Delta ~0.50, Gamma
              dağ gibi yüksek. ETH %2 yukarı oynarsa delta hızla 0.70'e
              çıkar. Aynı opsiyona aylar var olsa, delta sadece 0.52'ye
              çıkar — Gamma çok daha düşüktür.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX vade gününde (0DTE) ATM call: Gamma astronomik. 5 puanlık
              SPX hareketi prim üzerinde inanılmaz etki yapar. Bu yüzden
              0DTE 'kumar' gibi davranır — ya hep ya hiç.
        horology_link: escapement
        horology_note: "Gamma = escapement'in mandalı. Küçük itme büyük zıplama."
        quiz:
          question: "Hangi opsiyon en YÜKSEK gamma'ya sahiptir?"
          options:
            - text: "60 günlük deep ITM call."
              correct: false
              feedback: "ITM opsiyonların delta'sı 1'e yapışmış, gamma düşük."
            - text: "3 günlük ATM call."
              correct: true
              feedback: "Doğru — ATM + çok kısa vade = maksimum gamma. Piyasa yapıcının en zor yönettiği bölge."
            - text: "180 günlük far OTM put."
              correct: false
              feedback: "Far OTM ve uzun vade — gamma çok düşük."
        glossary_refs: [gamma, delta, atm, escapement]

      - id: M3L3
        slug: theta-vega-tekrar
        title: "Theta ve Vega — M2'nin Tekrarı, Greeks Çerçevesinde"
        learning_objective: "Theta ve Vega'yı diğer Greeks ile birlikte bir 'risk parmak izi' olarak okumak."
        body: |
          Bu kısa bir köprü dersi. Theta ile Vega'yı M2'de zaten öğrendin; şimdi
          dördünü tek bir resimde topluyoruz. Çünkü bir opsiyon pozisyonunu
          gerçekten anlamak, onu dört rakamla "okumak" demektir — adına risk
          parmak izi diyebiliriz:

          - Delta (Fiyat Duyarlılığı): şu anki yön ve hedge oranı.
          - Gamma (Risk İvmesi): Delta'nın ne kadar çabuk değiştiği.
          - Theta (Zaman Kaybı Hızı): her gün eriyen değer.
          - Vega (Volatilite Hassasiyeti): IV değişimine duyarlılık.

          Bu dört rakam genelde iki klasik karakter çizer. Diyelim ki Selin
          opsiyon ALMIŞ ("long gamma"): hareketten kazanır ama zaman onun
          aleyhinedir; volatilite artarsa keyiflenir. Karşı tarafta opsiyon
          SATAN biri ise ("short gamma"): hareket onun düşmanı, zaman dostudur;
          volatilite düşerse mutlu olur.

          Hedge kültürüyle bağlayalım: protective put alan kişi "long gamma"
          tarafındadır (korunur ama prim öder). Covered call yazan ise kısmen
          "short gamma" tarafındadır (kira toplar ama sert harekette zorlanır).
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC protective put alıyorsun (long gamma profili): BTC sert
              düşerse put primi hızla şişer (gamma çalışır), DVOL
              fırlarsa Vega da yardım eder. Karşılığında theta her gün
              biraz erir — sigortan ücretini öder.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX covered call yazıyorsun (short gamma profili): yatay
              piyasada theta sana kira getirir. Sert yukarı hareket
              fırsat maliyeti; sert aşağı hareket de zaten elindeki
              hisseyi koruyamaz, sadece prim kadar tampon.
        horology_link: balance-wheel
        horology_note: "Greeks = saatin tüm parçaları. Hiçbiri tek başına saati anlatmaz."
        quiz:
          question: "Pozitif Theta + Negatif Gamma profili hangi pozisyona aittir?"
          options:
            - text: "Long call alıcısı."
              correct: false
              feedback: "Tersine — long opsiyon alıcısı negatif theta + pozitif gamma."
            - text: "Opsiyon satıcısı (örn. covered call yazan)."
              correct: true
              feedback: "Doğru. Satıcı her gün theta kazanır ama gamma riski taşır (sert hareket onu vurur)."
            - text: "Cash pozisyon (opsiyon yok)."
              correct: false
              feedback: "Cash pozisyonun Greek'i sıfırdır — Greek pozisyonu opsiyonla taşınır."
        glossary_refs: [theta, vega, gamma, delta, covered-call, protective-put]

      - id: M3L4
        slug: greeks-balance-wheel
        title: "Greeks Bir Arada — Saatin Balance Wheel'i"
        learning_objective: "Greeks'i tek tek değil, birbiriyle bağlantılı bir sistem olarak okumak."
        body: |
          Bir saatte mainspring, escapement ve balance wheel ayrı ayrı çalışmaz;
          birlikte saati yaparlar. Greeks de öyle — tek tek değil, birbirine
          bağlı okunur.

          Birkaç bağlantı: Gamma yüksekse Theta da yüksektir (kısa vade, ATM
          bölgesi). Delta'sı sıfıra yakın "nötr" görünen bir pozisyonun bile
          Gamma'sı yüksekse, küçük bir hareketten sonra Delta'sı kayar — yani
          pozisyon sen farkına varmadan yön tutmaya başlar. Vega'sı yüksek
          pozisyonlar ise her VIX/DVOL şokunda titrer.

          Pratikte basit bir karar alışkanlığı kur. Önce "ne istiyorum?"
          sorusunu Greek diline çevir:
          - Yön bahsi yapıyorsan → Delta önemli.
          - Yönü bilmiyor ama hareket bekliyorsan → Gamma + Vega önemli.
          - Yatay piyasa bekliyorsan → Theta önemli (satıcı tarafı).
          - Volatilite rejimi değişecek diyorsan → Vega önemli.

          Sonra pozisyonu kurmadan ÖNCE Greek profilini bir kenara yaz. Ve
          unutma: Greeks zamanla değişir — vadeye yaklaştıkça Gamma artar, Theta
          hızlanır. Bu, kurumsal bir trader masasının düşünme biçimidir; AXIOM
          Akademisi'nin amacı tam olarak bu çerçeveyi Türkçe sezgi diliyle senin
          diline getirmektir.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              "Spot 1 ay yatay kalır + DVOL düşer" tezi. Greek profili:
              negatif Gamma (yatay piyasa), pozitif Theta, negatif Vega.
              Bu = OTM put SATMAK (cash-secured) veya iron condor.
              Çıktı Greek diliyle netleşince hangi strateji uygun belli olur.
          - asset: us_index
            symbol: SPX
            scenario: |
              "VIX 14'te, çok düşük, fırlayacak" tezi. Greek profili:
              Delta nötr (yön bilinmiyor), pozitif Vega, pozitif Gamma.
              Bu = long straddle veya long volatilite ETF kombinasyonu.
        horology_link: balance-wheel
        horology_note: "Tüm parçalar uyumlu — bu, opsiyonun 'saat mühendisliği'."
        quiz:
          question: "Bir trader 'yön bilmiyorum ama sert hareket bekliyorum, VIX de fırlayacak' diyor. Hangi Greek profili?"
          options:
            - text: "Delta yüksek pozitif, Vega negatif."
              correct: false
              feedback: "Tersine — yön bilinmiyor (delta nötr) ve VIX yükselişi long Vega gerektirir."
            - text: "Delta nötr, pozitif Gamma + pozitif Vega."
              correct: true
              feedback: "Doğru. Long straddle gibi bir yapı bu profili verir."
            - text: "Theta pozitif (satıcı tarafı)."
              correct: false
              feedback: "Satıcı pozisyonu sert hareketten ZARAR ETER — bu trader'ın istediğinin tersi."
        glossary_refs: [delta, gamma, theta, vega, straddle, balance-wheel, complications]

  # ==========================================================================
  # MODÜL 4 — Hedge Stratejileri (uygulama)
  # ==========================================================================
  - id: M4
    slug: hedge-stratejileri
    title: "Hedge Stratejileri — Sigortayı Pratiğe Dökmek"
    tagline: "Mainspring kurulu, escapement ayarlı — şimdi koruma."
    tier_required: premium
    summary: |
      Bu modül teoriyi pratiğe çevirir. Dört temel hedge yapısı: protective
      put (sigorta), covered call (kira), collar (sigorta + kira hibrid) ve
      spread/straddle giriş seviyesi. Her birinin payoff sezgisi, max
      kâr/zarar ve kullanım senaryosu.
    duration_min: 25
    lessons:

      - id: M4L1
        slug: protective-put
        title: "Protective Put — Portföy Sigortası"
        learning_objective: "Protective put'un payoff yapısını, ne zaman ve neden kullanıldığını kavramak."
        body: |
          Diyelim ki Emre'nin elinde değerli bir varlık var ve onu kaybetmekten
          korkuyor. Yapacağı şey çok basit: aynı varlık üzerine bir put almak.
          Buna protective put denir — yani bildiğimiz yangın sigortası.

          Peki sonucu ne olur? İki yönü ayrı ayrı düşün. Aşağı tarafta, fiyat ne
          kadar düşerse düşsün, kaybı put'un strike seviyesinde DURUR — sigorta
          devreye girer. Toplam en kötü zararı kabaca "(başlangıç fiyatı −
          strike) + ödediği prim" kadardır. Yukarı tarafta ise hiçbir tavan
          yoktur; varlık yükselmeye devam eder, sadece ödediği prim cebinden
          çıkmıştır.

          Yani Emre yukarıdan küçük bir parçayı (primi) feda edip aşağıyı bir
          bariyere bağladı. Artık rahat uyuyabilir.

          Bu yapı en çok şu anlarda işe yarar: belirsiz bir olaydan önce (FOMC,
          enflasyon verisi, kripto borsa olayı, OPEX); uzun süredir kârda olan ve
          satmak istemediği ama düşüşten korktuğu bir pozisyon varken; ya da
          tatil gibi likiditenin düştüğü sakin olmayan dönemlerden önce.

          Maliyeti de ayarlayabilirsin: strike spot'a ne kadar yakınsa sigorta o
          kadar hızlı devreye girer ama o kadar pahalıdır. Uzak (derin OTM) bir
          put ucuzdur ama yalnızca büyük felakete karşı korur, küçük düşüşlere
          değil.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              1 BTC tutuyorsun. 30 günlük %5 OTM put alıyorsun. DVOL
              normalse prim genelde ucuz; rejim panikse pahalı.
              FOMC haftası öncesinde alır, hafta sonu ihtiyaç biterse
              ters kapatırsın (zaman değeri kalmışsa kısmi geri alırsın).
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX ETF tutuyorsun. Yıl sonu likidite düşüklüğü dönemi
              öncesi 60 günlük %7 OTM SPX put alıyorsun. Hiçbir şey
              olmazsa prim erir. Sert düşüş gelirse Vega + Delta + Gamma
              birlikte primi şişirir.
        horology_link: mainspring
        horology_note: "Sigortanın mainspring'i kuruldu; vade tamamlandığında ya kullanılır ya erir."
        quiz:
          question: "100 hisse hisse var, hisse 100. 90 strike put aldın, prim 3. Maks zararın nedir?"
          options:
            - text: "Maks zarar 0 — koruma tam."
              correct: false
              feedback: "Hayır — strike altı korunur, strike'a kadar olan düşüş + prim ödenir."
            - text: "Maks zarar (100-90) + 3 = 13 hisse başı."
              correct: true
              feedback: "Doğru. Spot 90'a düşene kadar 10 birim kayıp + 3 prim = 13 toplam."
            - text: "Maks zarar sınırsız."
              correct: false
              feedback: "Protective put'un anlamı tam olarak BUNU önler. Maks zarar tavanlıdır."
        glossary_refs: [protective-put, put, prim, max-zarar, breakeven]

      - id: M4L2
        slug: covered-call
        title: "Covered Call — Yatay Piyasada Kira"
        learning_objective: "Covered call'un payoff'unu, kazancını ve gizli fırsat maliyetini kavramak."
        body: |
          Diyelim ki Zeynep'in elinde bir varlık var ve yakın vadede pek
          hareket beklemiyor. "Madem öyle duruyor, bari kira getirsin" diye
          düşünür. Yaptığı şey: aynı varlık üzerine bir call SATMAK. Buna covered
          call denir — kira geliri yapısı.

          Üç olası sonuç var. Fiyat yatay ya da hafif yukarı kalırsa: hem
          varlığı elinde tutar hem de tahsil ettiği prim cebinde kalır — en
          tatlı senaryo. Fiyat sert yukarı patlarsa: varlık yine kazandırır ama
          call kullanılır, yani varlığı strike fiyatından satmak zorunda kalır;
          yukarısı "tavanlanmıştır", kazancı (strike − başlangıç) + prim ile
          sınırlıdır. Fiyat aşağı düşerse: varlık değer kaybeder, topladığı prim
          yalnızca küçük bir tampondur.

          İşte en kritik nokta burada: covered call seni aşağı KORUMAZ. Çok kişi
          "covered call güvenlidir" sanır — hayır. Sen sadece yukarıdan kısmen
          vazgeçip kira topladın; düşüş gelirse portföyün hâlâ açıktadır. Hem
          aşağı korunmak hem kira toplamak istiyorsan, bir sonraki dersteki
          collar yapısına ihtiyacın var.

          Özetle covered call; yatay/hafif yükseliş beklediğin, yakın vadede
          patlama ummadığın ve düzenli prim toplamak istediğin durumlar içindir.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              10 ETH tutuyorsun. 30 günlük %10 OTM call SATIYORSUN. Prim
              cebine giriyor. ETH yatay veya hafif yukarı → prim senin,
              ETH'in senin. ETH %20 patlarsa → strike'tan satarsın,
              patlamayı kaçırdın ama %10 + prim kazandın.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX ETF tutuyorsun. Aylık %5 OTM SPX call yazıyorsun. Vade
              haftaları boyunca theta sana kira getirir. Aylık küçük
              ama düzenli prim akışı; uzun vadede portföy verimini artırır.
              Riski: keskin yukarı atak fırsatını kaçırır.
        horology_link: escapement
        horology_note: "Covered call = sen escapement tarafındasın. Tıkırtı sana kazandırıyor."
        quiz:
          question: "Hisse 100. 110 call yazdın (sattın), prim 2. Hisse 130'a fırladı. Pozisyonun ne olur?"
          options:
            - text: "Kazancım 30 + 2 = 32."
              correct: false
              feedback: "Hayır — 110 strike'ta hisseyi vermek zorundasın. Kazancın 10 (110-100) + 2 (prim) = 12."
            - text: "Kazancım 12 — yukarıdan vazgeçtim, prim aldım."
              correct: true
              feedback: "Doğru. Yukarı tavanlı; 130-110 = 20 'kaçırılan' fırsat maliyetidir."
            - text: "Kayıp ettim çünkü call assignment oldu."
              correct: false
              feedback: "Kazanç var ama yukarı tavanlı. Kayıp değil, fırsat maliyeti."
        glossary_refs: [covered-call, call, prim, theta, max-kar]

      - id: M4L3
        slug: collar
        title: "Collar — Sigorta + Kira Hibrid"
        learning_objective: "Collar yapısının payoff'unu ve neden 'düşük maliyetli sigorta' yapısı olduğunu kavramak."
        body: |
          Önceki iki derste iki şey öğrendik: protective put alttan korur ama
          prim ödetir; covered call kira getirir ama aşağı korumaz. Peki ikisini
          birleştirsek? İşte collar tam olarak bu.

          Diyelim ki Can aynı varlık üzerine AYNI ANDA hem bir protective put
          ALIR (alttan sigorta) hem de bir covered call SATAR (üstten kira). İşin
          güzel tarafı: call'dan aldığı primle put'un primini finanse eder. Çoğu
          zaman bu öyle ayarlanır ki net cebinden çıkan para neredeyse sıfır olur
          — buna "sıfır maliyetli collar" denir.

          Sonuç bir koridordur. Yukarıda covered call strike'ı bir tavan koyar,
          aşağıda protective put strike'ı bir taban. Arada fiyat serbestçe
          hareket eder. Yani Can portföyünü iki seviye arasındaki bir KANALA
          hapsetmiştir; saat çoğunlukla yatay tıkırdar.

          Bu yapı; bir dönemi (FOMC haftası, OPEX, tatil) düşük dalgalanmayla
          geçirmek isteyen, aşağı korunmak isteyip prim ödemek istemeyen ve
          zaten yukarıda büyük bir hareket beklemeyen biri içindir.

          Ama "sıfır maliyetli = bedava" sanma. Bedava değil — yukarıyı feda
          ettin. Beklenmedik bir patlama olursa o potansiyeli kestin. Bedava öğle
          yemeği yoktur; sadece ödemenin biçimi değişmiştir.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              1 BTC, FOMC haftası. -5% strike put AL + +10% strike call
              SAT. Net prim ~0 (DVOL rejimine göre). FOMC haftası BTC
              -5% ile +10% arasında kalırsa hiçbir şey olmaz. Aşırı
              hareket olursa bantların biri devreye girer.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX ETF'i 90 günlüğüne 'koridorda' tutmak için collar.
              %5 OTM put AL + %5 OTM call SAT. Yıl sonu likidite
              dönemini düşük volatilite ile geçirmek için klasik
              kurumsal tertip.
        horology_link: balance-wheel
        horology_note: "Collar = balance wheel'i tam ortaya kalibre etmek. Aşırı salınım yok."
        quiz:
          question: "Zero-cost collar kurdun. Hisse koridorda yatay kaldı. Pnl?"
          options:
            - text: "Büyük kazanç çünkü prim bedava."
              correct: false
              feedback: "Hayır — hisse hareket etmediği için PnL ≈ 0 + işlem maliyeti."
            - text: "Yaklaşık sıfır — hareket olmadığı için ne sigortaya ne kiraya ihtiyaç oldu."
              correct: true
              feedback: "Doğru. Collar koridor stratejisidir; koridorda hisse hareketsizse PnL küçük."
            - text: "Büyük kayıp çünkü iki opsiyon birden var."
              correct: false
              feedback: "Hayır — net prim ~0 olduğu için 'maliyet' yapısal olarak küçük."
        glossary_refs: [collar, protective-put, covered-call, max-kar, max-zarar]

      - id: M4L4
        slug: spread-straddle-giris
        title: "Spread ve Straddle — Çok Bacaklı Yapılara Giriş"
        learning_objective: "Bull spread ve straddle yapılarını sezgisel olarak ayırt etmek; ne zaman yönlü ne zaman yönsüz strateji uygun olur."
        body: |
          Şimdiye kadar tek bacaklı yapılar gördük. Burada iki bacağı birden
          kullanan, ileri seviyeye giriş niteliğinde iki yapı tanışacağız.

          Birincisi BULL CALL SPREAD — "yönlü ama tavanlı". Diyelim ki Selin
          yukarı yönde bir görüşe sahip ama hareketin sınırlı kalacağını
          düşünüyor. Düşük strike'tan bir call ALIR, daha yüksek strike'tan bir
          call SATAR. Sattığı bacak alımı ucuzlatır; karşılığında hem kazancı hem
          riski tavanlanır. Tek başına call almaktan daha ucuza, daha kontrollü
          bir yön bahsi yapmış olur.

          İkincisi LONG STRADDLE — "yönsüz ama sert hareket". Bu kez Selin yönü
          bilmiyor ama büyük bir hareket bekliyor. Aynı strike'tan hem call hem
          put ALIR. Fiyat hangi yöne giderse gitsin, yeterince sert hareket
          ederse kazanır. En kötü ihtimalde kaybı ödediği toplam primdir;
          potansiyeli ise teorik olarak sınırsızdır. Tek düşmanı Theta'dır —
          hareket gelmezse iki bacak da birden erir. FOMC, kripto regülasyon
          haberi ya da bilanço öncesi klasik tercihtir.

          Bu yapılara girerken önce Greek profilini bir kenara yaz (M3L4'ü
          hatırla). "Ne istiyorum?" sorusu Greek diliyle netleşince, hangi yapının
          uygun olduğu kendiliğinden ortaya çıkar.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              "BTC bir ay içinde yukarı gider ama sınırlı" tezi:
              ATM call AL + %10 OTM call SAT (bull spread). Net prim
              tek bacaklı call'dan ucuz. Eğer BTC patlarsa fırsat
              maliyetin var (üst bacakta tavanlandın) ama riskin de
              tavanlı.
          - asset: us_index
            symbol: SPX
            scenario: |
              FOMC öncesi: yön bilinmiyor ama hareket bekleniyor.
              Long ATM straddle. Fed güvercin de olsa şahin de olsa
              SPX sert hareket ederse straddle kazanır. Eğer Fed
              beklendiği gibi davranır ve piyasa yatay kalırsa theta
              iki bacakta birden ödenir.
        horology_link: complications
        horology_note: "Spread ve straddle = saatte complication. Ana fonksiyonun üstüne ek mekanizma."
        quiz:
          question: "FOMC kararı öncesi yönü bilmiyorsun ama sert hareket bekliyorsun. Hangi yapı?"
          options:
            - text: "Covered call yaz — prim topla."
              correct: false
              feedback: "Tam tersi — sert hareket covered call yazanı yakar. Bu yatay piyasa stratejisidir."
            - text: "Long straddle — yön nötr, hareket bahsi."
              correct: true
              feedback: "Doğru. Straddle yönü olmayan ama hareket bekleyen pozisyon için klasiktir."
            - text: "Bull call spread."
              correct: false
              feedback: "Bull spread yönlüdür (yukarı). 'Yön bilmiyorum' senaryosuna uymaz."
        glossary_refs: [bull-call-spread, straddle, strangle, vega, gamma, complications]

  # ==========================================================================
  # MODÜL 5 — Gelir Stratejileri
  # Prim toplama sistemleri: opsiyonu SATARAK düzenli gelir
  # ==========================================================================
  - id: M5
    slug: gelir-stratejileri
    title: "Gelir Stratejileri — Prim Toplama Sistemleri"
    tagline: "Escapement tıkırdar, kira akar — zaman senin için çalışır."
    tier_required: premium
    summary: |
      Bu modül opsiyonu ALMAK değil SATMAK üzerine. Opsiyon satıcısı her gün
      theta (zaman) primi toplar — yatay piyasada 'kira geliri' gibi. Dört
      sistem: cash-secured put (indirimli giriş + prim), covered call
      sistematiği (kira merdiveni), Çark (tam döngü gelir) ve iron condor
      (iki taraflı tanımlı-riskli prim). Felsefe: yön tahmin etmek yerine
      zaman + volatilite primini hasat etmek. Uyarı: satıcı tarafı 'küçük sık
      kazanç + nadir büyük kayıp' profili taşır — disiplin ve pozisyon boyutu
      hayatidir.
    duration_min: 26
    lessons:

      - id: M5L1
        slug: cash-secured-put
        title: "Cash-Secured Put — İndirimli Giriş + Prim"
        learning_objective: "Cash-secured put'un hem 'prim geliri' hem 'indirimli giriş' sağladığını ve neden teminatlandırıldığını kavramak."
        body: |
          Diyelim ki Deniz bir varlığı almak istiyor ama bugünkü fiyat ona biraz
          yüksek geliyor; "biraz düşse de alsam" diye bekliyor. Bu beklerken
          ona para kazandıracak bir yol var: cash-secured put satmak.

          Deniz nakit ayırır ve bir OTM put SATAR. Aslında verdiği söz şudur:
          "Bu varlık şu fiyata inerse almaya hazırım." Bu sözü verdiği için ona
          prim ödenir. Sonra iki şeyden biri olur:

          - Fiyat o seviyeye inmezse: put boşa düşer, prim Deniz'in cebinde
            kalır. Saf gelir. İsterse aynı şeyi tekrar yapar.
          - Fiyat o seviyeye inerse: varlığı zaten istediği fiyattan almış olur
            (buna "atanmak" denir). Üstüne aldığı primi de düşersek, gerçek
            maliyeti daha da ucuzdur.

          Yani sezgi şu: almak istediğin varlığı, beklediğin fiyatta, sana ödeme
          yapılarak beklemek.

          Peki neden "nakit-teminatlı"? Çünkü Deniz, satışın yükümlülüğünü (gerekirse
          varlığı almaya yetecek nakdi) önceden ayırır. Bu, teminatsız "çıplak"
          put satışından farkıdır — çıplak satış marj çağrısı riski taşır, biz
          ondan kaçınırız.

          Bu yapı en çok IV yüksekken (prim dolgun), zaten girmek istediğin bir
          varlıkta ve atanırsan o varlığı tutmaya hazırsan mantıklıdır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              1 BTC almaya niyetlisin ama bugünkü fiyat sana biraz pahalı.
              1 BTC'lik nakdi ayırıp %7 OTM put satıyorsun. DVOL yüksekse
              prim dolgun. BTC düşmezse prim senin; %7 altına inerse BTC'yi
              o seviyeden (artı prim indirimiyle) almış olursun.
          - asset: us_index
            symbol: SPX
            scenario: |
              Endeks ETF'ine girmek istiyorsun ama düzeltme bekliyorsun.
              Nakit ayırıp aylık %5 OTM put satıyorsun. VIX yüksek dönemde
              prim cazip. Düşmezse prim akışı; düşerse hedeflediğin
              seviyeden girersin.
        horology_link: escapement
        horology_note: "Escapement sana çalışıyor — beklerken her tıkırtı prim getiriyor."
        quiz:
          question: "Cash-secured put sattın. Vade sonunda spot strike'ın ÜSTÜNDE kaldı. Ne olur?"
          options:
            - text: "Varlığı strike'tan almak zorundasın."
              correct: false
              feedback: "Hayır — atama yalnızca spot strike ALTINA inerse olur. Üstte kalırsa put değersiz biter."
            - text: "Put değersiz biter, topladığın prim senin kalır."
              correct: true
              feedback: "Doğru. Spot strike üstündeyse put kullanılmaz; prim saf gelir olarak kalır."
            - text: "Zarar edersin çünkü put sattın."
              correct: false
              feedback: "Tersine — put satıcısı için en sakin senaryo budur: prim cepte, yükümlülük doğmadı."
        glossary_refs: [cash-secured-put, put, prim, assignment, iv-rank, theta]

      - id: M5L2
        slug: covered-call-sistematigi
        title: "Covered Call Sistematiği — Kira Merdiveni"
        learning_objective: "Tek seferlik covered call yerine yenilenen bir kira akışı kurmayı ve strike/vade seçim mantığını kavramak."
        body: |
          M4L2'de covered call'ın ne olduğunu öğrendin. Şimdi tek seferlik bir
          işlemi düzenli bir gelir alışkanlığına çeviriyoruz. Buna "kira
          merdiveni" diyelim.

          Diyelim ki Zeynep'in elinde uzun vadede tutmak istediği bir varlık var.
          Her vade dolduğunda yeni bir OTM call yazar; tıpkı bir kiracıya her ay
          kira keser gibi düzenli prim toplar. Ama iki ayarı doğru yapması gerek.

          Önce strike seçimi: call'ı spot'a yakın yazarsa bol prim alır ama
          varlığı yukarıda kaçırma (çağrılma) riski büyür. Uzağa yazarsa az prim
          alır ama yukarı alanını korur. Sonra vade seçimi: genelde 30-45 gün
          tatlı noktadır — theta erimesi hızlanmaya başlamış ama gamma riski
          henüz çok değildir. Haftalık ya da günlük call yazmak daha çok tıkırtı
          verir ama yönetimi yorucudur ve riski büyütür. Bir de zamanlama: IV
          yüksekken yazmak satıcının lehinedir, çünkü primler dolgundur.

          Ve o vazgeçilmez hatırlatma: covered call sigorta DEĞİLDİR. Aşağı
          korunmazsın; sadece yukarıdan kısmen vazgeçip kira toplarsın. Güçlü bir
          yükseliş trendinde, varlığını sürekli "ucuza verme" riski vardır.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              10 ETH tutuyorsun. Her ay %10 OTM call yazıyorsun. ETH yatay
              veya hafif yukarıyken her vade priminden kira akar. Sert
              patlamada strike'tan satarsın — patlamayı kaçırırsın ama
              %10 + prim kazanmış olursun.
          - asset: us_index
            symbol: SPX
            scenario: |
              Endeks ETF'i tutuyorsun. 35 günlük %5 OTM call merdiveni
              yazıyorsun. Aylık küçük ama düzenli prim portföy verimini
              artırır; riski keskin yukarı atağı kaçırmak.
        horology_link: escapement
        horology_note: "Kira merdiveni = escapement'in düzenli tıkırtısı; her tur primini topla."
        quiz:
          question: "Covered call merdiveninde EN İYİ senaryo hangisidir?"
          options:
            - text: "Varlık sert yukarı patlar."
              correct: false
              feedback: "Hayır — patlamada strike'tan satarsın, yukarıyı kaçırırsın. İyidir ama en iyi değil."
            - text: "Varlık yatay veya hafif yukarı kalır."
              correct: true
              feedback: "Doğru. Yatay/hafif yukarıda hem varlığı tutarsın hem primi cebe koyarsın."
            - text: "Varlık sert düşer."
              correct: false
              feedback: "Hayır — covered call aşağı korumaz; düşüşte prim sadece küçük bir tampondur."
        glossary_refs: [covered-call, call, prim, theta, iv-rank, delta]

      - id: M5L3
        slug: cark-the-wheel
        title: "Çark (The Wheel) — Tam Döngü Gelir Sistemi"
        learning_objective: "Cash-secured put ile covered call'u birleştiren kapalı döngü 'Çark' sistemini ve hangi rejimde anlamlı olduğunu kavramak."
        body: |
          Diyelim ki Ayşe uzun zamandır Ethereum almak istiyor. Ama bugünkü
          fiyat ona biraz pahalı geliyor; "biraz daha düşse de alsam" diye
          bekliyor. Elinde de bir miktar nakit var, öylece duruyor.

          Çark stratejisi tam burada devreye girer. Ayşe önce bir cash-secured
          put satar (M5L1'de öğrendiğimiz yapı). Aslında yaptığı şey şu söze
          benzer: "Ethereum şu fiyata inerse almaya hazırım." Bu sözü verdiği
          için ona PRİM ödenir. Şimdi iki şey olabilir:

          - Ethereum o fiyata inmezse: put boşa düşer, prim Ayşe'nin cebinde
            kalır. Ertesi hafta yeni bir put satar. Çark dönmeye başlamıştır.
          - Ethereum o fiyata inerse: Ayşe Ethereum'u zaten istediği fiyattan
            almış olur. Üstüne aldığı primi de hesaba katarsak, gerçek
            maliyeti daha da ucuzdur.

          Artık Ayşe'nin elinde Ethereum var. Burada çarkın ikinci yarısı
          devreye girer: bu Ethereum'un üstüne bir covered call satar (M5L2'deki
          yapı). Bu sefer verdiği söz şu: "Fiyat şu seviyeye çıkarsa satmaya
          razıyım." Ve yine ona prim ödenir. Eğer fiyat yükselir de Ethereum
          elinden çıkarsa, nakit geri döner — ve Ayşe başa sarıp yeniden put
          satmaya başlar.

          İşte çark böyle döner: put sat → (atanırsan) call sat → (satılırsa)
          nakde dön → tekrar put sat. Her turda, bir saatin escapement
          tıkırtısı gibi, küçük ama düzenli primler birikir. Dikkat et: Ayşe
          fiyatın yönünü tahmin etmeye çalışmıyor. Fiyat düşse de çıksa da
          çarkından prim topluyor — sistemin güzelliği bu.

          Ama bir uyarı: Çark yalnızca gerçekten sahip olmak istediğin,
          kaliteli bir varlıkta mantıklıdır. Çünkü bir gün atanırsın ve o
          varlığı bir süre tutman gerekebilir. Eğer varlık uzun süre düşerse,
          atanırsın ve topladığın primler bu düşüşü tam karşılamayabilir.
          Kısacası Çark, sınırsız para basan bir makine değil; "her tur küçük
          kazanç, ama nadiren büyük bir düşüşte yakalanma" karakteri taşıyan
          disiplinli bir gelir alışkanlığıdır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC Çark: cash-secured put sat → atanırsan BTC'yi indirimli al
              → üstüne covered call yaz → çağrılırsa nakde dön → tekrar put
              sat. DVOL yüksek dönemde her turda dolgun prim.
          - asset: us_index
            symbol: SPX
            scenario: |
              Kaliteli endeks ETF'inde Çark: put sat, atanırsan ETF'i tut +
              call yaz, çağrılırsa nakde dön. Sahip olmaktan memnun olduğun
              bir varlık olduğu için atama 'kötü sonuç' değildir.
        horology_link: balance-wheel
        horology_note: "Çark sürekli döner; balance wheel gibi düzenli salınımla prim üretir."
        quiz:
          question: "Çark'ta cash-secured put'tan atandın — yani varlığı satın aldın. Sıradaki adım nedir?"
          options:
            - text: "Hemen zararına sat, döngüyü kır."
              correct: false
              feedback: "Hayır — Çark'ın mantığı atanan varlığın üstüne kira yazmaktır, panikle satmak değil."
            - text: "Üstüne covered call yaz, prim toplamaya devam et."
              correct: true
              feedback: "Doğru. Atama sonrası varlığın üstüne covered call yazarsın; çark dönmeye devam eder."
            - text: "Aynı varlıkta ikinci bir put daha sat."
              correct: false
              feedback: "Çark'ta atama sonrası put değil COVERED CALL aşamasına geçilir; varlık zaten elinde."
        glossary_refs: [wheel, cash-secured-put, covered-call, assignment, prim, iv-rank]

      - id: M5L4
        slug: iron-condor
        title: "Iron Condor — İki Taraflı, Tanımlı-Riskli Kira"
        learning_objective: "Iron condor'un dört bacaklı yapısını, neden 'tanımlı riskli prim toplama' olduğunu ve hangi rejimde kurulduğunu kavramak."
        body: |
          Diyelim ki Emre bir varlığın bir süre dar bir aralıkta, yatay
          kalacağını düşünüyor. Ne yukarı ne aşağı; sadece "oyalanacak" diyor.
          Bu görüşten para kazanmanın yolu iron condor.

          Emre aynı anda iki tarafa birden prim satar: alt tarafta bir bull put
          spread (fiyat şu desteğin altına inmez bahsi), üst tarafta bir bear
          call spread (fiyat şu direnci geçmez bahsi). Yani fiyatın bir KANALDA
          kalacağına oynar. Yatay piyasa ve düşen volatilite onun lehinedir.

          Sonuç şöyle: fiyat iki orta seviye arasında kalırsa, en iyi kazancı
          topladığı net primdir. Kanaldan dışarı çıkarsa zarar başlar — AMA
          spread'lerin dış bacakları bu zararı bir yerde TAVANLAR. İşte bu, iron
          condor'u tehlikeli "çıplak" satıştan ayıran şeydir: en kötü zararın
          önceden bilinir ve sınırlıdır.

          Bu yapı en çok IV yüksekken (primler dolgun), fiyatın dar bir bantta
          kalacağını düşündüğünde ve takvimde sert bir olay yokken kurulur.

          Riskin dürüst yüzü: iron condor "küçük ama sık kazanç, nadiren büyük
          kayıp" karakteri taşır. Bu yüzden kanat genişliği ve pozisyon boyutu
          disiplini şarttır — tek büyük hareket, biriken birçok küçük kazancı bir
          çırpıda silebilir.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC bir süredir range-bound ve DVOL yüksek. Alt tarafta bir
              put spread + üst tarafta bir call spread satıyorsun. BTC kanalda
              kalırsa iki taraftan da prim toplar, vade sonu net primi tutarsın.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX sakin bir dönemde, VIX orta-yüksek. Iron condor ile fiyatın
              dar bir bantta kalacağına oynuyorsun. Theta her gün lehine
              çalışır; sert kırılma olursa zarar tavanlıdır.
        horology_link: balance-wheel
        horology_note: "Kanal = balance wheel'in dar salınım kalibresi; aşırı titreşim olmazsa prim akar."
        quiz:
          question: "Iron condor EN ÇOK hangi senaryoda kazanır?"
          options:
            - text: "Fiyat sert yukarı veya sert aşağı kırılır."
              correct: false
              feedback: "Hayır — sert kırılma iron condor'u zarara sokar. O, hareket bekleyenin (straddle) işidir."
            - text: "Fiyat kanalda yatay kalır ve IV düşer."
              correct: true
              feedback: "Doğru. Yatay fiyat + IV düşüşü hem theta hem vega açısından iron condor'un lehinedir."
            - text: "IV sert yükselir."
              correct: false
              feedback: "Tersine — iron condor kısa vega taşır; IV yükselişi aleyhinedir."
        glossary_refs: [iron-condor, bull-put-spread, bear-call-spread, credit-spread, theta, iv-rank]

  # ==========================================================================
  # MODÜL 6 — Yönlü & Volatilite Stratejileri
  # Spekülasyonu disipline sokan tanımlı-riskli yapılar
  # ==========================================================================
  - id: M6
    slug: yonlu-volatilite-stratejileri
    title: "Yönlü & Volatilite Stratejileri — Risk-Tanımlı Spekülasyon"
    tagline: "Complication eklenir — yön ve hareket kalibre edilir."
    tier_required: premium
    summary: |
      Spekülasyon kaçınılmazsa onu DİSİPLİNE sokarız: çıplak opsiyon yerine
      iki bacaklı yapılarla riski TANIMLI yaparız. Bu modül yön bahsini
      (debit ve credit spread'ler) volatilite/hareket bahsinden (straddle,
      strangle, calendar) ayırır. Anahtar fikir: ne istediğini Greek diliyle
      netleştir, sonra yapıyı seç. Her yapıda maks kâr ve maks zarar
      önceden bilinir.
    duration_min: 26
    lessons:

      - id: M6L1
        slug: debit-spreadler
        title: "Debit Spread'ler — Ucuz ve Tanımlı Yön (Bull Call / Bear Put)"
        learning_objective: "Debit spread'in çıplak opsiyona göre neden ucuz + tanımlı olduğunu, bull call ve bear put kuruluşunu kavramak."
        body: |
          Diyelim ki Can bir varlığın yukarı gideceğine inanıyor ama tek başına
          call almak ona pahalı geliyor — hem prim yüksek hem de her gün theta
          eriyor. Daha akıllı bir yol var: debit spread.

          Mantık şu: tek bacak yerine iki bacak kullanırsın ve bir tanesini
          satarak diğerini ucuzlatırsın. İki çeşidi var. Yukarı görüş için BULL
          CALL SPREAD: düşük strike'tan bir call ALIRSIN, daha yüksek strike'tan
          bir call SATARSIN. Sattığın bacak maliyetini düşürür; karşılığında
          yukarı potansiyelin tavanlanır. Aşağı görüş içinse aynası olan BEAR PUT
          SPREAD vardır: yüksek strike put AL, düşük strike put SAT.

          Bunun güzelliği: net primin düşüktür, theta ve vega riski kısmen söner,
          ve hem kazancın hem zararın bellidir. En fazla kazancın "strike farkı
          − ödediğin net prim"; en fazla zararın ise sadece ödediğin net primdir.
          Daha fazlasını kaybedemezsin.

          Bu yapı; net bir yön görüşün olduğunda ama hareketin sınırlı kalacağını
          düşündüğünde, özellikle de IV düşük (prim ucuz) iken yön almak
          istediğinde mantıklıdır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              'BTC ılımlı yukarı gider ama çok uzağa değil' tezi: ATM call AL
              + %10 OTM call SAT (bull call spread). Net prim tek call'dan
              ucuz. Hedefe ulaşırsa tavanlı kâr; ulaşmazsa kayıp net primle
              sınırlı.
          - asset: us_index
            symbol: SPX
            scenario: |
              'SPX ılımlı düşer' tezi: ATM put AL + OTM put SAT (bear put
              spread). Aşağı yönlü ama riski ödenen primle tavanlanmış.
        horology_link: complications
        horology_note: "Spread = complication: ana yön mekanizmasına bir frenleme parçası ekler."
        quiz:
          question: "Bull call spread kurdun. Maksimum zararın nedir?"
          options:
            - text: "Sınırsız."
              correct: false
              feedback: "Hayır — debit spread'in tüm amacı riski tavanlamaktır. Sınırsız risk çıplak satışta olur."
            - text: "Ödediğin net prim."
              correct: true
              feedback: "Doğru. Debit spread'te maks zarar = ödenen net primdir; daha fazlasını kaybedemezsin."
            - text: "Strike farkı kadar."
              correct: false
              feedback: "Strike farkı maks KÂR ile ilgilidir (eksi net prim). Maks zarar ödenen primdir."
        glossary_refs: [bull-call-spread, bear-put-spread, debit-spread, prim, max-kar, max-zarar]

      - id: M6L2
        slug: credit-spreadler
        title: "Credit Spread'ler — Prim Toplayan Yön (Bull Put / Bear Call)"
        learning_objective: "Credit spread'in nasıl 'yön + prim toplama' birleştirdiğini ve debit'ten farkını kavramak."
        body: |
          Önceki derste prim ödeyerek yön aldık (debit). Şimdi tam tersini
          yapacağız: prim TAHSİL ederek yön alacağız. Buna credit spread denir ve
          işin güzel yanı, çoğu zaman "kesin doğru" tahmin etmek bile gerekmez.

          Diyelim ki Selin bir varlığın belli bir desteğin altına inmeyeceğini
          düşünüyor — illa fırlamasını beklemiyor, sadece "düşmez" diyor. Bir
          OTM put SATAR, biraz daha aşağıdan bir put ALIR. Buna BULL PUT SPREAD
          denir; fiyat üstte kaldığı sürece topladığı primi tutar. (Aslında bu,
          iron condor'un alt yarısıdır.) Aynı mantığın tersi BEAR CALL SPREAD'dir:
          "şu direnci geçmez" diyorsan, OTM call satıp daha yukarıdan call alırsın.

          Buradaki incelik şu: fiyatın belirli bir seviyenin ötesine GİTMEMESİ
          yeterli — yerinde dursa bile kazanırsın, çünkü zaman (theta) senin için
          çalışır. En fazla kazancın topladığın net prim; en fazla zararın ise
          "strike farkı − net prim" ile sınırlıdır.

          Kısa bir karşılaştırma: debit spread hareket İSTER (theta düşman, IV
          düşükken tercih edilir); credit spread ise hareketsizlikten bile
          kazanır (theta dost, IV yüksekken tercih edilir).
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              'BTC şu desteğin altına inmez' tezi: o desteğin altında bir put
              SAT + daha aşağıda bir put AL (bull put spread). BTC yatay veya
              yukarı kalırsa net prim senin; sert düşerse zarar tavanlı.
          - asset: us_index
            symbol: SPX
            scenario: |
              'SPX şu direnci geçmez' tezi: direncin üstünde call SAT + daha
              yüksek call AL (bear call spread). Fiyat altta kalırsa theta
              lehine çalışır, primi tutarsın.
        horology_link: escapement
        horology_note: "Credit spread = escapement tarafı; fiyat yerinde dururken tıkırtı sana akar."
        quiz:
          question: "'Fiyatın yukarıda KALMASI yeterli, fırlaması şart değil' görüşüne en uygun yapı?"
          options:
            - text: "Bull call spread (debit)."
              correct: false
              feedback: "Bull call spread hareket gerektirir (theta düşman). 'Sadece kalsın' görüşüne credit daha uygun."
            - text: "Bull put spread (credit)."
              correct: true
              feedback: "Doğru. Credit spread'te fiyatın seviyeyi koruması yeter; theta lehine çalışır."
            - text: "Long straddle."
              correct: false
              feedback: "Straddle yön/hareket bekler; 'yerinde kalsın' görüşünün tam tersidir."
        glossary_refs: [bull-put-spread, bear-call-spread, credit-spread, theta, prim, iv-rank]

      - id: M6L3
        slug: straddle-strangle-derin
        title: "Straddle & Strangle — Volatilite ve Hareket Bahsi"
        learning_objective: "Yönsüz hareket bahsini (long) ve prim toplama (short) ayrımını, theta-vega trade-off'unu ve vol crush tuzağını kavramak."
        body: |
          Straddle'ı M4L4'te kısaca tanımıştık; şimdi hem derinleşelim hem de
          satış (short) tarafını ekleyelim.

          Diyelim ki Deniz yönü bilmiyor ama büyük bir hareket bekliyor. Aynı
          strike'tan hem call hem put ALIRSA buna long straddle denir. Eğer
          maliyeti düşürmek isterse, ikisini de OTM alır — buna long strangle
          denir; daha ucuzdur ama kazanmak için daha sert bir hareket gerekir.
          İkisi de yönsüz "hareket + volatilite artışı" bahsidir; tek düşmanları
          Theta'dır.

          Bu yapıları SATAN biri ise tam tersini ister: yatay piyasa ve düşen
          volatilite. Theta onun lehinedir. Ama dikkat: çıplak (teminatsız) satış
          teorik olarak SINIRSIZ risk taşır. AXIOM çerçevesi bunun yerine
          tanımlı-riskli kuzenini önerir: iron condor (M5L4).

          Şimdi en sinsi tuzağa gelelim — VOL CRUSH. Long straddle'ın kazanması
          için hareketin ödenen primden BÜYÜK olması gerekir. Bir olay (bilanço,
          FOMC) öncesinde IV zaten şişmiştir, yani prim pahalıdır. Olay
          gerçekleşince belirsizlik biter ve IV çöker. İşte o an, fiyat hareket
          etse bile, IV'nin çöküşü Vega üzerinden primi söndürebilir ve
          kaybedersin. Acemilerin en sık düştüğü tuzak budur: "olay oldu ama ben
          yine de kaybettim."
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              Büyük bir kripto regülasyon/borsa haberi öncesi, yön belirsiz
              ama sert hareket bekleniyor. Long straddle: haber hangi yönde
              gelirse gelsin sert hareket primi karşılarsa kazanır. Hareket
              cılızsa veya DVOL haber sonrası çökerse theta + vol crush vurur.
          - asset: us_index
            symbol: SPX
            scenario: |
              VIX çok düşük, piyasa aşırı sakin. Bir trader long straddle ile
              'VIX bu seviyede kalamaz' vega bahsi yapar. VIX fırlarsa straddle
              primi şişer; sakinlik sürerse theta iki bacakta birden öder.
        horology_link: balance-wheel
        horology_note: "Straddle = balance wheel maksimum salınıma kurgulu; ama yay (IV) gevşerse durur."
        quiz:
          question: "Olay öncesi yüksek IV'den long straddle aldın. Olay geldi: fiyat AZ hareket etti ve IV çöktü. Sonuç?"
          options:
            - text: "Kesin kazanç — olay gerçekleşti çünkü."
              correct: false
              feedback: "Hayır — olayın gerçekleşmesi yetmez. Hareket cılız + IV çöküşü (vol crush) seni zarara sokabilir."
            - text: "Büyük olasılıkla kaybedersin — vol crush + yetersiz hareket."
              correct: true
              feedback: "Doğru. Bu klasik vol crush tuzağıdır: hareket primi karşılamaz, IV çöküşü Vega'yı söndürür."
            - text: "Theta lehine çalışır, kazanırsın."
              correct: false
              feedback: "Long straddle'da theta DÜŞMANDIR; lehine çalışmaz."
        glossary_refs: [straddle, strangle, vega, theta, gamma, implied-vol]

      - id: M6L4
        slug: calendar-spread
        title: "Calendar Spread — Zaman ve Volatilite Oynamak"
        learning_objective: "Calendar spread'in aynı strike farklı vade yapısını ve neden bir 'theta + vega' oyunu olduğunu kavramak."
        body: |
          Şimdiye kadarki spread'ler hep aynı vadedeydi. Calendar (takvim) spread
          farklı bir şey yapar: aynı strike'ı kullanır ama iki FARKLI vade.

          Klasik kurulum şöyle: yakın vadeyi SATARSIN, uzak vadeyi ALIRSIN (ikisi
          de aynı strike). Mantığı bir saat ustasının iki ayrı yayı yönetmesine
          benzer. Yakın vadeli bacağın yayı hızlı boşalır (theta hızlı erir) ve
          bu sana kazandırır. Uzak vadeli bacak ise vega taşır; volatilite
          yükselirse o şişer ve yine sana kazandırır.

          Yani aslında iki şeyi aynı anda oynuyorsun: kısa vadenin hızlı
          erimesini ve uzun vadenin volatiliteye duyarlılığını. En iyi senaryo:
          fiyat strike civarında oyalanır (yakın bacak değersiz erir) ve bu
          sırada IV yükselir (uzak bacak şişer).

          Eğer aynı strike yerine farklı strike kullanırsan buna diagonal spread
          denir — zamanı ve yönü birlikte oynarsın (daha ileri seviye).

          Ne zaman? Yakın vadenin volatilitesi uzak vadeden yüksekken ve fiyatın
          strike civarında kalacağını düşündüğünde. Riski de açık olalım: büyük
          bir yönlü hareket iki bacağı da bozar. Bu, modülün en ileri yapısıdır;
          Greek profili sürekli değiştiği için yönetim ister.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC'nin kısa vadede strike civarında oyalanacağını düşünüyorsun.
              Yakın vade call SAT + aynı strike uzak vade call AL. Yakın bacak
              hızlı erir; DVOL term yapısı lehine dönerse uzak bacak şişer.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX'in bir seviyeye 'çakılı' kalacağı, sonra volatilitenin
              artacağı beklentisi: aynı strike'ta yakın vade SAT + uzak vade
              AL. Theta yakında lehine, Vega uzakta lehine.
        horology_link: mainspring
        horology_note: "İki mainspring, farklı boşalma hızı — yakın yay hızlı boşalır, uzak yay enerjiyi tutar."
        quiz:
          question: "Calendar spread (yakın sat + uzak al) EN İYİ hangi durumda çalışır?"
          options:
            - text: "Fiyat sert yukarı veya aşağı fırlar."
              correct: false
              feedback: "Hayır — büyük yönlü hareket calendar'ı bozar. O, fiyatın strike civarı kalmasını ister."
            - text: "Fiyat strike civarında kalır ve IV yükselir."
              correct: true
              feedback: "Doğru. Yakın bacak değersiz erir (theta), uzak bacak IV artışıyla şişer (vega) — ikisi de lehine."
            - text: "IV sert düşer."
              correct: false
              feedback: "Uzak bacak Vega-long olduğu için IV düşüşü genelde aleyhinedir."
        glossary_refs: [calendar-spread, theta, vega, implied-vol, complications]

  # ==========================================================================
  # MODÜL 7 — Strateji Seçim Çerçevesi
  # Tüm yapıları tek karar sistemine bağlamak
  # ==========================================================================
  - id: M7
    slug: strateji-secim-cercevesi
    title: "Strateji Seçim Çerçevesi — Hangi Durumda Hangi Yapı"
    tagline: "Tüm parçalar uyumlu — saat mühendisi gibi seç."
    tier_required: premium
    summary: |
      Bu modül 'ezber strateji' değil, bir DÜŞÜNME SİSTEMİ verir. Tüm
      yapıları (M4-M6) dört eksenli tek karar çerçevesinde birleştirir:
      yön, hareket beklentisi, elindeki pozisyon ve IV rejimi. Ardından
      'para kazandıran tek disiplinli kenar' olan IV Rank zamanlamasını ve
      pozisyona göre seçimi işler. Son ders risk yönetimi ve en pahalıya mal
      olan yaygın hataları ele alır.
    duration_min: 24
    lessons:

      - id: M7L1
        slug: dort-eksenli-karar-agaci
        title: "Dört Eksenli Karar Ağacı"
        learning_objective: "Strateji seçimini dört soruya indirgemek: yön, hareket, pozisyon, IV rejimi."
        body: |
          Bunca strateji öğrendik. Peki gerçek bir anda hangisini seçeceğini
          nasıl bilirsin? İşin sırrı şu: her strateji aslında dört sorunun
          cevabıdır. Yapıdan başlama — önce kendine bu dört şeyi sor:

          1) YÖN: yukarı mı, aşağı mı, yönsüz mü?
          2) HAREKET: sert mi olacak, sınırlı mı, yatay mı?
          3) POZİSYON: elinde varlık mı var, nakit mi, yoksa hiçbir şey mi?
          4) IV REJİMİ: prim pahalı mı (IV yüksek → satmaya meyilli ol), yoksa
             ucuz mu (IV düşük → almaya meyilli ol)?

          Bu dört cevap seni neredeyse otomatik olarak doğru yapıya götürür.
          Birkaç örnek eşleşme:
          - Yukarı + sınırlı + nakit + IV düşük → bull call spread
          - Yukarı/yatay + nakit + IV yüksek → bull put spread
          - Yönsüz + yatay + varlık var + IV yüksek → covered call / iron condor
          - Yönsüz + sert + elde bir şey yok + IV düşük → long straddle / strangle
          - Aşağı koruma + varlık var → protective put / collar
          - Girmek istiyorum + nakit + IV yüksek → cash-secured put

          Altın kural: ÖNCE dört soruyu cevapla, SONRA yapıyı seç. Önce bir yapıya
          gönül verip sonra senaryoyu ona uydurmaya çalışmak, yapılan en yaygın
          strateji hatasıdır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              'BTC tutuyorum (pozisyon: varlık), yatay bekliyorum (yön/hareket:
              yönsüz-yatay), DVOL yüksek (IV: yüksek), prim istiyorum.' Dört
              eksen → covered call. Aşağı koruma da istersen → collar.
          - asset: us_index
            symbol: SPX
            scenario: |
              'Nakitim var (pozisyon: nakit), endeks ucuzlarsa girerim (yön:
              yukarı/yatay), VIX yüksek (IV: yüksek).' Dört eksen →
              cash-secured put.
        horology_link: balance-wheel
        horology_note: "Dört eksen = saatin dört ana parçası; biri eksikse seçim hatalı kalibre olur."
        quiz:
          question: "'Varlığım var + yatay bekliyorum + IV yüksek + düzenli prim istiyorum.' Hangi yapı?"
          options:
            - text: "Long straddle."
              correct: false
              feedback: "Hayır — straddle hareket bekler ve prim ÖDER. Sen prim toplamak ve yatay piyasa istiyorsun."
            - text: "Covered call."
              correct: true
              feedback: "Doğru. Varlık + yatay + yüksek IV + prim isteği = covered call'ın klasik profili."
            - text: "Bear put spread."
              correct: false
              feedback: "Bear put spread aşağı yönlü bir bahistir; yatay + prim toplama profiline uymaz."
        glossary_refs: [covered-call, iron-condor, protective-put, cash-secured-put, iv-rank]

      - id: M7L2
        slug: iv-rejimine-gore-secim
        title: "IV Rejimine Göre Seçim — Prim Al mı, Prim Sat mı?"
        learning_objective: "IV Rank'ı kullanarak 'opsiyon alıcısı mı satıcısı mı olmalıyım' kararını vermek."
        body: |
          Eğer tüm akademiden tek bir şey hatırlayacaksan, bu ders olsun. Çünkü
          profesyonel masaların ilk baktığı filtre yön değil, primin pahalı mı
          ucuz mu olduğudur. Bunu ölçen şeye IV Rank denir: bugünkü IV, son bir
          yılın neresinde?

          Mantığı şuna dayanır: volatilite ortalamasına geri döner (bugün çok
          yüksekse zamanla iner, çok düşükse zamanla çıkar). O yüzden:

          - IV Rank YÜKSEKSE (kabaca %50 üstü): primler şişkindir, SATICI olmak
            avantajlıdır. Uygun yapılar: covered call, cash-secured put, iron
            condor, credit spread. Yüksekten satarsan hem IV'nin düşüşü hem theta
            birlikte sana çalışır.
          - IV Rank DÜŞÜKSE (kabaca %20 altı): primler ucuzdur, ALICI olmak
            avantajlıdır. Uygun yapılar: protective put (ucuz sigorta), tek bacak
            call/put, debit spread, long straddle. Ucuza alırsan IV'nin yükselme
            potansiyeli ve düşük theta lehine olur.

          İşte "para kazandıran" o disiplinli kenar budur: yönü tahmin etmek
          değil, primin zamanlamasını doğru yapmak.

          Ama bir uyarı şart: yüksek IV "bedava para" demek değildir. IV genelde
          gerçek bir riski fiyatlar; satıcı o kuyruk riskini sırtlar. Bu filtre
          sana bir avantaj verir, garanti değil.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              DVOL son 1 yılın tepe bölgesinde (IV Rank yüksek): satıcı tarafı
              cazip — cash-secured put, covered call, iron condor. DVOL dipteyse
              (IV Rank düşük): alıcı tarafı — ucuz protective put, debit spread.
          - asset: us_index
            symbol: SPX
            scenario: |
              VIX panik bölgesinde (IV Rank yüksek): credit spread / iron condor
              için dolgun prim. VIX çok düşükken: ucuz protective put veya long
              straddle (vega) mantıklı.
        horology_link: balance-wheel
        horology_note: "IV Rank = balance wheel'in salınım genişliği; geniş salınımda satıcı, dar salınımda alıcı kenarı bulur."
        quiz:
          question: "IV Rank %85. Yapısal olarak hangi taraf avantajlıdır?"
          options:
            - text: "Alıcı tarafı (long call/put, debit spread)."
              correct: false
              feedback: "Hayır — IV Rank yüksekken primler pahalıdır; ALMAK dezavantajlıdır."
            - text: "Satıcı tarafı (credit spread, covered call, cash-secured put)."
              correct: true
              feedback: "Doğru. Yüksek IV Rank şişkin primler demektir; satıcı tarafı yapısal kenar taşır."
            - text: "IV Rank seçimi etkilemez."
              correct: false
              feedback: "Tersine — IV Rank al/sat kararının en güçlü tek filtresidir."
        glossary_refs: [iv-rank, vrp, implied-vol, realized-vol, covered-call, protective-put]

      - id: M7L3
        slug: pozisyona-gore-secim
        title: "Pozisyona Göre Seçim — Elinde Ne Var?"
        learning_objective: "Mevcut pozisyona (spot / nakit / boş) göre uygun opsiyon overlay'ini seçmek."
        body: |
          Doğru strateji, çoğu zaman "ne düşündüğünden" çok "elinde ne olduğuna"
          bağlıdır. Üç kişiyi düşün.

          Birincisi, elinde SPOT VARLIK tutan biri. Aşağıdan korkuyorsa
          protective put (sigorta) veya collar (ucuz sigorta) kurar. Yatay bir
          görüşü varsa ve gelir istiyorsa covered call yazar.

          İkincisi, elinde NAKİT olan ve girmek isteyen biri. Beklediği fiyat
          bugünün altındaysa cash-secured put satar (hem indirimli giriş hem
          prim). Bunu sistematik hale getirmek isterse Çark'ı (Wheel) döndürür.

          Üçüncüsü, elinde HİÇBİR ŞEY olmayan, saf bir görüşü olan biri. Yön +
          sınırlı hareket bekliyorsa debit veya credit spread; yön bilmeden sert
          hareket bekliyorsa straddle / strangle kurar.

          Bütün bunların altındaki tek ilke şu: elindekini çalıştır. Boş duran
          spot covered call ile kira getirebilir; boş duran nakit cash-secured
          put ile prim üretebilir. "Atıl" varlık, risk bilinciyle, gelir üreten
          bir varlığa dönüşebilir. AXIOM'un felsefesi de bu sırayla işler: önce
          korun, sonra gelir üret, en son spekülasyon yap.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              Üç kullanıcı: (1) BTC tutan + düşüş korkusu → protective put;
              (2) nakit bekleyen + indirimli giriş → cash-secured put;
              (3) hiç tutmayan + sert hareket görüşü → straddle. Aynı varlık,
              farklı pozisyon, farklı doğru yapı.
          - asset: us_index
            symbol: SPX
            scenario: |
              Endeks ETF'i tutan kullanıcı yatay görüş + gelir isterse covered
              call; aşağı koruma isterse collar. Nakitte bekleyen ucuza girmek
              isterse cash-secured put.
        horology_link: escapement
        horology_note: "Her pozisyonun kendi escapement ayarı vardır — elindeki neyse onu tıkırdat."
        quiz:
          question: "'Nakitim var, X varlığını daha ucuza almak isterim, beklerken gelir de olsun.' Hangi yapı?"
          options:
            - text: "Protective put."
              correct: false
              feedback: "Protective put elinde VARLIK varken sigortadır; nakitten giriş senaryosuna uymaz."
            - text: "Cash-secured put."
              correct: true
              feedback: "Doğru. Nakit + indirimli giriş + beklerken prim = cash-secured put'un tam tanımı."
            - text: "Covered call."
              correct: false
              feedback: "Covered call elinde VARLIK varken kira içindir; henüz varlığın yok."
        glossary_refs: [protective-put, collar, covered-call, cash-secured-put, wheel]

      - id: M7L4
        slug: risk-yonetimi-yaygin-hatalar
        title: "Risk Yönetimi & Yaygın Hatalar"
        learning_objective: "Pozisyon boyutu, çıplak risk, atama, vol crush, likidite ve SPK çerçevesi gibi kritik risk konularını tanımak."
        body: |
          Bir saat ne kadar güzel olursa olsun, bakımı yapılmazsa durur. En
          parlak strateji bile kötü risk yönetimiyle batar. Bu yüzden bu son ders
          en önemlilerinden biri. İşte hayatta kalmanın yedi kuralı:

          1) POZİSYON BOYUTU: tek bir işleme sermayenin yalnızca küçük bir
             parçasını koy. Çark/cash-secured put'ta her zaman "atanırsam bu
             varlığı tutabilir miyim?" testini geç.
          2) ÇIPLAK OPSİYON SATMA: teminatsız call satışı teorik olarak SINIRSIZ
             risktir. AXIOM çerçevesi hep tanımlı-riskli yapıları (spread, iron
             condor, cash-secured) önceler.
          3) ATAMA: sattığın opsiyon kâra geçerse beklenmedik anda atanabilirsin
             (özellikle ABD hissesinde temettü öncesi). Buna hazırlıklı ol.
          4) VOL CRUSH: bir olaydan hemen önce, IV şişkinken long opsiyon almak
             tuzaktır — olay geçince IV çöker, fiyat hareket etse bile
             kaybedebilirsin (M6L3'ü hatırla).
          5) THETA YÖNÜ: opsiyon aldıysan zaman düşmanın, sattıysan dostundur.
             Pozisyonu ve bekleme süreni buna göre planla.
          6) LİKİDİTE: geniş alış-satış makası gizli bir maliyettir. Likit
             kontrat seç; yoksa her giriş-çıkışta sessizce para sızdırırsın.
          7) SPK ÇERÇEVESİ: bu içerik EĞİTİM amaçlıdır, yatırım tavsiyesi
             değildir. Kendi araştırmanı yap; kaybetmeyi göze alamayacağın parayla
             işlem yapma.

          Ve her şeyin özeti, AXIOM'un pusulası: önce korun, sonra gelir üret, en
          son spekülasyon yap — ve her zaman tanımlı riskle.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              Çıplak BTC call satışı bir gecede sert ralliyle haftaların
              primini siler (sınırsız risk). Aynı görüş tanımlı bir bear call
              spread ile ifade edilirse maks zarar bilinir ve sınırlıdır.
          - asset: us_index
            symbol: SPX
            scenario: |
              Earnings/FOMC öncesi şişkin IV'den long straddle almak klasik
              vol crush tuzağıdır: olay sonrası VIX/IV çöker, cılız hareket
              primi karşılamaz. Olay-odaklı long opsiyonda IV rejimini
              önce kontrol et.
        horology_link: complications
        horology_note: "Saat ne kadar çok complication taşırsa o kadar bakım ister — karmaşık yapı, sıkı risk disiplini."
        quiz:
          question: "Aşağıdakilerden hangisi TANIMSIZ (teorik olarak sınırsız) risk taşır?"
          options:
            - text: "Covered call (varlık elinde)."
              correct: false
              feedback: "Hayır — covered call'da varlık elinde olduğu için risk tanımlıdır (fırsat maliyeti hariç)."
            - text: "Teminatsız çıplak call satışı."
              correct: true
              feedback: "Doğru. Çıplak (naked) call satışı yukarı sınırsız olduğu için teorik olarak sınırsız risk taşır."
            - text: "Iron condor."
              correct: false
              feedback: "Iron condor'un uzun bacakları riski tavanlar; maksimum zararı bilinir ve sınırlıdır."
        glossary_refs: [naked-option, assignment, vrp, max-zarar, iron-condor, theta]

  # ==========================================================================
  # MODÜL 8 — İleri Yapılar & Sermaye Verimliliği
  # Kelebekler, PMCC/LEAPS, oranlı yaylım, sentetikler — usta işi complication'lar
  # ==========================================================================
  - id: M8
    slug: ileri-yapilar-sermaye-verimliligi
    title: "İleri Yapılar & Sermaye Verimliliği"
    tagline: "Saatin complication'ları — ana mekanizmaya eklenen ince işçilik."
    tier_required: premium
    summary: |
      Bu modül opsiyonun "usta işi" tarafıdır — bir saatteki complication'lar
      gibi, ana mekanizmanın üstüne eklenen ince yapılar. Dört ders: kelebek &
      demir kelebek (bir noktaya oynamak), fakirin covered call'u & LEAPS (az
      sermaye, aynı gelir fikri), oranlı yaylım & backspread (dengesiz bacaklar)
      ve sentetik pozisyonlar & risk reversal & evli put (put-call paritesi
      sezgisi). Hepsi tanımlı düşünceyle kurulur; ileri seviyedir ve dikkatli
      pozisyon boyutu ister.
    duration_min: 26
    lessons:

      - id: M8L1
        slug: kelebek-iron-butterfly
        title: "Kelebek & Demir Kelebek — Bir Noktaya Oynamak"
        learning_objective: "Butterfly ve iron butterfly yapılarının 'fiyatın bir noktaya çakılması' bahsi olduğunu ve düşük maliyet/tanımlı risk dengesini kavramak."
        body: |
          Bazen bir yatırımcı "fiyat tam şuraya gelecek ve orada kalacak" diye
          düşünür. İşte kelebek (butterfly), tam bu görüşe göre tasarlanmış üç
          ayaklı zarif bir yapıdır.

          Diyelim ki Selin fiyatın belirli bir seviyeye yakın bitmesini bekliyor.
          Bir long call butterfly kurar: alt strike'tan bir call ALIR, ortadaki
          strike'tan İKİ call SATAR, üst strike'tan bir call daha ALIR (hepsi
          eşit aralıklı). Sonuç çok düşük maliyetli, riski ödediği küçük primle
          sınırlı bir pozisyondur. En yüksek kazancı, fiyat tam ortadaki strike'a
          "çakılırsa" gelir; ortadan uzaklaştıkça kazanç azalır. Yani kelebek bir
          "nokta" bahsidir — ucuzdur ama isabet ister.

          İkinci akraba demir kelebek (iron butterfly). Bunu iron condor'un dar
          kuzeni gibi düşün. Iron condor'da iki kısa strike birbirinden uzaktı
          (geniş koridor); iron butterfly'da ise iki kısa bacak aynı noktada,
          ATM'de toplanır. Sonuç: çok daha dolgun prim ama çok daha dar bir
          kazanç penceresi. Fiyat ATM civarında kalırsa bol prim alırsın;
          uzaklaşırsa zarar — ama yine dış bacaklar sayesinde tanımlı.

          Tek cümlelik sezgi: iron condor "geniş bir koridorda kalsın" der; iron
          butterfly "tam buraya yapışsın" der. Daha çok prim, ama daha az hata
          payı. En çok IV yüksekken ve fiyatın bir seviyeye demir atacağını
          düşündüğünde mantıklıdır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC bir süredir belirli bir seviyeye takılı ve DVOL yüksek. ATM
              kısa bacaklı bir iron butterfly ile "burada kalır" diyorsun: dar
              pencere karşılığında dolgun prim, dış bacaklar zararı tavanlar.
          - asset: us_index
            symbol: SPX
            scenario: |
              OPEX haftası, SPX'in bir seviyeye "pinlenmesi" (max-pain etkisi)
              bekleniyor. Düşük maliyetli bir long butterfly ile o noktaya
              ucuz bir bahis yaparsın; isabet ederse kelebek açılır.
        horology_link: complications
        horology_note: "Kelebek = saatteki ince bir complication; tek bir an için kalibre edilmiş hassas mekanizma."
        quiz:
          question: "Iron condor ile iron butterfly arasındaki temel fark nedir?"
          options:
            - text: "Iron butterfly'ın riski sınırsızdır."
              correct: false
              feedback: "Hayır — iron butterfly'ın da dış bacakları riski tavanlar; tanımlı risklidir."
            - text: "Iron butterfly'da iki kısa bacak ATM'de toplanır; pencere daha dar, prim daha dolgun."
              correct: true
              feedback: "Doğru. Iron butterfly, daha dar bir kazanç penceresi karşılığında daha yüksek prim verir."
            - text: "Iron butterfly yalnızca yukarı yönlü bir bahistir."
              correct: false
              feedback: "Hayır — iron butterfly yönsüz, 'bir noktaya çakılma' bahsidir."
        glossary_refs: [butterfly, iron-butterfly, iron-condor, credit-spread, theta, max-pain]

      - id: M8L2
        slug: pmcc-leaps
        title: "Fakirin Covered Call'u (PMCC) & LEAPS — Az Sermaye, Aynı Fikir"
        learning_objective: "PMCC'nin covered call'u daha az sermayeyle nasıl taklit ettiğini ve LEAPS'in 'hisse yerine koyma' mantığını kavramak."
        body: |
          Covered call güzel bir gelir yapısıydı (M5L2), ama bir zorluğu var:
          önce o varlığa tam olarak sahip olman gerekir — bu da çok sermaye
          demektir. Peki ya o kadar paran yoksa ama aynı fikri uygulamak
          istiyorsan?

          Önce bir kavram: LEAPS. Bu, vadesi çok uzun (genelde bir yıldan fazla)
          bir opsiyondur. Derin ITM, uzun vadeli bir call neredeyse varlığın
          kendisi gibi davranır (delta'sı 1'e yakındır) ama çok daha ucuza
          alınır. Buna "hisse yerine koyma" denir: varlığı satın almak yerine,
          onun yerini tutan uzun vadeli bir call tutarsın.

          Şimdi numarayı birleştirelim. Diyelim ki Emre gerçek varlığı almak
          yerine derin ITM bir LEAPS call alıyor — bu onun "sahte varlığı". Sonra
          tıpkı covered call'daki gibi, bunun üstüne kısa vadeli bir OTM call
          SATIYOR ve prim topluyor. İşte buna Fakirin Covered Call'u (Poor Man's
          Covered Call — PMCC) denir. Aynı kira fikri, çok daha az sermayeyle.

          Avantajı sermaye verimliliğidir: aynı gelir stratejisini cebindeki
          paranın küçük bir kısmıyla kurarsın. Bedeli ise: LEAPS'in de bir
          theta'sı vardır (yavaş erir), uzun vade boyunca yönetmen gerekir ve
          gerçek varlık gibi temettü almazsın. Covered call'a inanıyor ama
          sermayeni daha verimli kullanmak istiyorsan bu senin yapın.
        worked_examples:
          - asset: crypto
            symbol: ETH
            scenario: |
              ETH'i doğrudan almak yerine uzak vadeli, derin ITM bir ETH call
              tutuyorsun (LEAPS mantığı). Üstüne kısa vadeli OTM call satıp
              kira topluyorsun — az sermayeyle covered call etkisi.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX ETF'i almak yerine bir yıldan uzun vadeli derin ITM SPX call
              tutuyorsun, her ay OTM call yazıyorsun. Klasik PMCC: aynı gelir,
              daha az bağlı sermaye.
        horology_link: mainspring
        horology_note: "LEAPS = uzun sarılı bir mainspring; yavaş boşalır, üstüne kısa yayların kirasını toplarsın."
        quiz:
          question: "PMCC'nin (Fakirin Covered Call'u) normal covered call'a göre temel avantajı nedir?"
          options:
            - text: "Aşağı yönde tam koruma sağlar."
              correct: false
              feedback: "Hayır — PMCC de aşağı korumaz; asıl avantajı sermaye verimliliğidir."
            - text: "Aynı kira fikrini çok daha az sermayeyle kurar (varlık yerine LEAPS)."
              correct: true
              feedback: "Doğru. Derin ITM LEAPS, varlığın yerini daha ucuza tutar; üstüne kısa call yazılır."
            - text: "Risksiz, garanti gelirdir."
              correct: false
              feedback: "Risksiz gelir yoktur; LEAPS'in theta'sı ve yön riski vardır."
        glossary_refs: [pmcc, leaps, covered-call, delta, theta, itm]

      - id: M8L3
        slug: ratio-spread-backspread
        title: "Oranlı Yaylım & Backspread — Dengesiz Bacaklar"
        learning_objective: "Ratio spread ve backspread'in eşit olmayan bacak sayısıyla yön + volatilite görüşünü nasıl birleştirdiğini kavramak."
        body: |
          Şimdiye kadarki spread'lerde bacaklar eşitti: bir al, bir sat. Peki ya
          bacak sayısını kasıtlı olarak dengesiz yaparsak? İşte oranlı (ratio)
          yapılar buradan doğar — ileri seviyedir ama mantığı sezgiseldir.

          Diyelim ki Deniz ılımlı bir yukarı hareket bekliyor ama "çok da fırlamaz"
          diyor. Bir ratio call spread kurar: bir call ALIR, daha yukarıdan İKİ
          call SATAR. Tek alımı iki satışla finanse ettiği için bunu çoğu zaman
          bedavaya, hatta prim alarak kurar. Fiyat ılımlı yükselirse harikadır.
          Ama dikkat: fazladan sattığı o bir bacak "açıkta" (çıplak) kalır; fiyat
          beklenmedik şekilde çok sert fırlarsa bu açık bacak onu yakar. Yani
          ratio spread, fazla satış tarafında gizli bir risk taşır.

          Tersini isteyen biri ise backspread kurar: bu sefer az SATIP çok ALIR
          (örneğin bir sat, iki al). Bu bir "sert hareket" bahsidir — fiyat
          beklenen yönde çok güçlü giderse fazladan alınan bacaklar büyük
          kazandırır. Karşılığında, hareket gelmezse ödenen küçük prim erir.

          Sezgi: ratio spread "ılımlı hareket olsun, prim toplayayım, ama aşırı
          hareketten korkarım" der; backspread ise "patlama bekliyorum, fazladan
          bacakla yakalayayım" der. Aynı ailenin iki zıt karakteri. İkisi de
          dikkatli pozisyon boyutu ister — özellikle ratio'nun çıplak bacağı.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC'nin ılımlı yükseleceğini ama fırlamayacağını düşünüyorsun →
              ratio call spread (1 al, 2 sat); beklenmedik sert ralli riskine
              dikkat. Tam tersine "patlayacak" diyorsan → call backspread
              (1 sat, 2 al).
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX'te keskin bir düşüş ihtimaline oynuyorsun → put backspread
              (1 sat, 2 al): büyük düşüşte fazladan put'lar güçlü kazandırır,
              düşüş gelmezse küçük prim erir.
        horology_link: balance-wheel
        horology_note: "Dengesiz bacaklar = balance wheel'i kasıtlı dengesiz kurmak; belli bir hareket genliğine göre ayar."
        quiz:
          question: "Bir call backspread (az sat, çok al) en çok hangi senaryoda kazanır?"
          options:
            - text: "Fiyat yatay kalır."
              correct: false
              feedback: "Hayır — yatay piyasada ödenen prim erir; backspread sert hareket ister."
            - text: "Fiyat beklenen yönde çok sert hareket eder."
              correct: true
              feedback: "Doğru. Fazladan alınan bacaklar büyük/sert harekette güçlü kazandırır."
            - text: "Volatilite çöker."
              correct: false
              feedback: "Tersine — backspread long vega/long gamma karakteri taşır; volatilite artışını sever."
        glossary_refs: [ratio-spread, backspread, naked-option, gamma, vega]

      - id: M8L4
        slug: sentetik-risk-reversal
        title: "Sentetik Pozisyonlar, Risk Reversal & Evli Put"
        learning_objective: "Opsiyonların hisseyi taklit edebildiğini (put-call paritesi), risk reversal ve married put yapılarının ne işe yaradığını kavramak."
        body: |
          Şaşırtıcı bir gerçekle başlayalım: opsiyonları birleştirerek varlığın
          kendisini taklit edebilirsin. Buna sentetik pozisyon denir ve put-call
          paritesi adı verilen derin bir dengeden gelir.

          Diyelim ki Can bir varlık almak istiyor ama nakit bağlamak istemiyor.
          Aynı strike'tan bir call ALIP bir put SATARSA, ortaya çıkan pozisyon
          neredeyse "varlığa sahip olmak" gibi davranır — buna sentetik uzun
          denir. Tersini yaparsa (put al, call sat) sentetik kısa elde eder.
          Opsiyon dünyasının iç tutarlılığını gösteren zarif bir fikirdir;
          fiyatlamada bir çarpıklık varsa buradan yakalanır.

          Bu fikrin pratik bir kuzeni var: risk reversal. Diyelim ki Selin yukarı
          yönlü ama tek başına call almak ona pahalı. Bir OTM put SATAR (prim
          toplar) ve o primle bir OTM call ALIR. Yani "düşersem alırım" riskini
          üstlenerek yukarı potansiyeli ucuza, hatta bedavaya finanse eder. Bu,
          collar'ın varlık olmadan kurulan, yönlü versiyonudur.

          Son olarak evli put (married put): bu aslında protective put'un (M4L1)
          bir nüansıdır. Fark şu: varlığı ve koruyucu put'u AYNI ANDA, beraber
          alırsın — onları "evlendirirsin". Niyet baştan bellidir: bu varlığı
          sigortalı olarak taşımak. Yapı protective put ile aynı; sadece kuruluş
          anı ve niyeti farklıdır.

          Sezgi: opsiyonlar yalnızca bahis aracı değildir. Aynı zamanda bir
          pozisyonu yeniden inşa etmenin (sentetik), yönü finanse etmenin (risk
          reversal) ve baştan sigortalı girmenin (evli put) esnek tuğlalarıdır.
        worked_examples:
          - asset: crypto
            symbol: BTC
            scenario: |
              BTC'ye nakit bağlamadan pozisyon almak için sentetik uzun (aynı
              strike call al + put sat). Ya da yukarı görüş için risk reversal:
              OTM put sat + o primle OTM call al.
          - asset: us_index
            symbol: SPX
            scenario: |
              SPX ETF'ini baştan sigortalı taşımak için evli put (varlık + put
              aynı anda). Yukarı yönlü ucuz bahis için ise risk reversal.
        horology_link: complications
        horology_note: "Sentetikler = aynı saati farklı parçalarla kurmak; put-call paritesi parçaların değişmez dengesidir."
        quiz:
          question: "Aynı strike'tan call ALIP put SATMAK yaklaşık olarak neye eşdeğerdir?"
          options:
            - text: "Nakitte beklemeye."
              correct: false
              feedback: "Hayır — bu pozisyonun bir yönü vardır; nakit nötr değildir."
            - text: "Varlığa sahip olmaya (sentetik uzun)."
              correct: true
              feedback: "Doğru. Call al + put sat (aynı strike) sentetik uzun pozisyon yaratır — put-call paritesi."
            - text: "Protective put'a."
              correct: false
              feedback: "Hayır — protective put 'varlık + put'tur; bu ise saf sentetik uzundur."
        glossary_refs: [synthetic-position, risk-reversal, married-put, protective-put, collar]

# ============================================================================
# SCENARIO CARDS — Faz 1'in 'Senaryo Sihirbazı' modülü (eğitici versiyon)
# ============================================================================
# Bu kartlar M5'i (Faz 2 köprüsü) önceleyen eğitici özettir. Kullanıcı
# "Piyasa beklentin ne?" sorusuna cevap verir, ona en uygun strateji
# kartını gösteririz. Faz 2'de bu canlı portföye bağlanır.
scenario_cards:
  - id: SC1
    market_view: "Yükselişe inanıyorum ama düşerse korunmak istiyorum"
    suggested_strategy: bull-call-spread
    why: "Yön yukarı + risk tavanlı. Tek bacaklı call'dan ucuz, koruma içsel."
    max_gain: "Bacak farkı - net prim. Tavanlı."
    max_loss: "Ödenen net prim. Tavanlı."
    horology_note: "Yaylım kalibresi — yön doğru ama complication ile sınırlandı."

  - id: SC2
    market_view: "Sert hareket bekliyorum ama yönü bilmiyorum"
    suggested_strategy: straddle
    why: "Yönsüz + büyük hareket. İki bacak da kazanma şansı taşır."
    max_gain: "Teorik sınırsız (özellikle yukarı bacakta)."
    max_loss: "Toplam prim. Hareket gelmezse theta iki bacakta birden erir."
    horology_note: "Balance wheel maksimum salınıma kurgulu."

  - id: SC3
    market_view: "Tuttuğum varlık var, alttan sigorta istiyorum"
    suggested_strategy: protective-put
    why: "Klasik sigorta yapısı — yangın sigortası."
    max_gain: "Spot - prim. Yukarı sınırsız."
    max_loss: "(Spot başlangıç - strike) + prim. Tavanlı."
    horology_note: "Mainspring kuruldu; sigorta vadeye kadar tıkırdar."

  - id: SC4
    market_view: "Tuttuğum varlık var, yatay piyasa bekliyorum, prim toplamak istiyorum"
    suggested_strategy: covered-call
    why: "Kira geliri yapısı — yatay piyasada theta sana akar."
    max_gain: "(Strike - başlangıç) + prim. Yukarı tavanlı."
    max_loss: "Spot - prim. Aşağı KORUNMADIN."
    horology_note: "Escapement'in tıkırtısı sana akıyor — ama mainspring yatay."

  - id: SC5
    market_view: "Bir dönemi (FOMC haftası vb.) düşük volatilite ile geçirmek istiyorum"
    suggested_strategy: collar
    why: "Sigorta + kira hibrid; net prim ~0 olabilir. Portföyü koridora hapseder."
    max_gain: "Call strike - başlangıç. Yukarı tavanlı."
    max_loss: "Başlangıç - put strike. Aşağı tavanlı."
    horology_note: "Balance wheel sıkı kalibre; aşırı salınım yok."

