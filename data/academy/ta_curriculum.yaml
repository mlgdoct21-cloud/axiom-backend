# AXIOM Teknik Analiz Akademisi — Müfredat (Faz 1: M1-M5)
#
# 5 modül, 20 ders. Türkçe sezgi dili + navigasyon marka vokabüleri
# (pusula/harita/sığlık — opsiyondaki horology'nin TA muadili).
# Worked example her derste: kripto (BTC/ETH) + ABD hisse (AAPL/SPY) + bazen BIST (ASELS).
#
# Kullanım:
# - services/academy_service.py bu dosyayı YAML olarak yükler (track=ta).
# - ta_glossary.yaml ile birlikte çalışır (glossary_refs slug bağı).
# - tier_required: free | premium | advance
# - Free kullanıcı M1 + M5L1 tadımlık + glossary tamamı + diğerleri için
#   "M2-M5 🔒 Premium" teaser görür.
# - "Şunu al/sat" dili YASAK; "şu olur, şöyle yorumlanır" dili (SPK eğitim).
# - Sayı/fiyat veren cümle YOK — sayılar runtime'da academy_ta_context.py ile
#   "bugünkü canlı bağlam rozeti" olarak enjekte edilir.

