  - id: M9
    slug: hacim-akis
    title: "Hacim ve Akış — Fiyatın Görünmeyen Yarısı"
    tagline: "Fiyat ne yaptı; hacim onu kim yaptı."
    tier_required: premium
    summary: |
      Bir hareketi yorumlamak için fiyat yetmez; "kim taşıdı, ne kadar baskıyla,
      kim direndi" sorularına hacim cevap verir. Bu modül hacmin sözlüğünü
      açar: klasik teyit kuralı, OBV/CMF akış indikatörleri, VWAP'in disiplini
      (kurumsalın gizli kontrolü) ve Volume Profile'ın hafıza haritası.
      Hacim olmadan teknik analiz tek-gözlü körlüktür.
    duration_min: 24
    lessons:

      - id: M9L1
        slug: hacim-temelleri
        title: "Hacim Temelleri — Teyit ve Sahte Kırılım Filtresi"
        learning_objective: "Hacmin bir hareketi nasıl teyit ettiğini, neden 'düşük hacimli kırılım' sahte kırılım adayı olduğunu öğrenmek."
        tier_required: premium
        body: |
          Diyelim ki Mehmet bir kırılım gördü: fiyat haftalardır $80K direncini
          test ediyordu ve nihayet üstüne kapandı. Heyecanla alım düşünüyor.
          Soru: hacim ne diyor?

          Hacim, bir barda işlem gören toplam miktardır. Fiyat hareketinin
          "ağırlığını" ölçer. Klasik kural:

          • Fiyat yukarı + hacim yüksek = sağlam yükseliş (alıcı baskısı gerçek).
          • Fiyat yukarı + hacim düşük = şüpheli yükseliş (kimse yok, kolay geri döner).
          • Fiyat aşağı + hacim yüksek = sağlam düşüş (satıcı baskısı gerçek).
          • Fiyat aşağı + hacim düşük = şüpheli düşüş (sadece korku/likidite eksikliği).

          Kırılımlarda en kritik soru:
          "Kırılım sırasında hacim ortalamanın kaç katı?"
          • 0.5x altı: çok zayıf; muhtemelen sahte kırılım.
          • 1.0x: ortalama, kırılım hipotezi belirsiz.
          • 1.5-2x: güçlü, kırılım kabul edilebilir.
          • 3x+: çok güçlü; klasik "blow-off" hareketi.

          Hacim örüntüleri:
          1) Konsolidasyon + dropping volume → "calm before storm". Sıkışma
             sırasında hacim düşer; kırılım anında patlar.
          2) Trend devamında artan hacim → sağlıklı trend.
          3) Trend yorgun olduğunda azalan hacim → güç tükeniyor.
          4) Climax volume (zirvede aşırı yüksek hacim) → trend dönüşü adayı.

          Önemli: Hacim tek başına yön söylemez; mevcut yorumu güçlendirir
          veya zayıflatır. Bir kırılım + güçlü hacim = ikisi birlikte. Bir
          kırılım + zayıf hacim = ya bekle ya küçük pozisyon.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC 3 haftadır $78-80K bandında sıkışmıştı. Ortalama günlük
              hacim $25 milyar. Bir gün büyük yeşil mum + $80K kırılımı +
              hacim $48 milyar (1.9x). Bu "klasik teyitli kırılım" senaryosu.
              Kırılım hipotezi güçlüdür; pozisyon açma için ek teyit (ertesi
              gün üstte kalma) makul.
          - asset: ABD Hissesi
            symbol: NVDA
            scenario: |
              NVDA bilanço öncesi $480 direncine yaklaştı. Bilanço açıklandı,
              fiyat $485'e koştu — ama hacim ortalamanın 0.8 katı. Tipik
              "bilanço relief rally + sahte kırılım" örüntüsü. Ertesi gün
              fiyat $475'e döndüğünde, hacim teyidi olmayan kırılımın neden
              güvenilmez olduğu netleşir.
        navigation_link: swell
        navigation_note: "Hacim, rüzgarın şiddetidir. Yelken (fiyat) doluysa ileri gidersin; rüzgar yoksa yelken sallanır ama gemi gitmez."
        quiz:
          question: "Bir direnç kırılımı düşük hacimle gerçekleşirse hangi tutum makul?"
          options:
            - text: "Şüpheli kabul et; sahte kırılım adayı, ek teyit (kapanış + hacim) bekle."
              correct: true
              feedback: "Doğru. Düşük hacimli kırılımlar tipik sahte kırılımlardır."
            - text: "Hemen büyük pozisyon aç."
              correct: false
              feedback: "Hayır. Hacim teyidi olmadan kırılım güvenilir değil."
            - text: "Trend dönüşü kesin."
              correct: false
              feedback: "Hacim eksikliği sadece şüphe doğurur; 'kesin dönüş' demez."
        glossary_refs: [hacim, hacim-teyidi, sahte-kirilim, climax-volume]

      - id: M9L2
        slug: obv-ve-cmf
        title: "OBV ve CMF — Akış İndikatörleri"
        learning_objective: "OBV (On-Balance Volume) ve CMF (Chaikin Money Flow) farkını, fiyat-akış divergence'ının ne anlattığını öğrenmek."
        tier_required: premium
        body: |
          Diyelim ki Ayşe hacme bakıyor ama "ekstra bir özet ister misin?" diye
          soruluyor. İki klasik akış indikatörü var: OBV ve CMF.

          OBV (On-Balance Volume, Joseph Granville, 1963): Çok basit ama güçlü.
          Her gün:
          • Kapanış dünden YÜKSEKSE → günün hacmini OBV'ye EKLE.
          • Kapanış dünden DÜŞÜKSE → günün hacmini OBV'den ÇIKAR.
          • Eşitse OBV değişmez.

          OBV bir "kümülatif" indikatördür; tek sayıdan oluşur. Yorumu:
          • OBV yeni zirve yapıyorsa fiyatın yeni zirvesi "akış teyitli".
          • OBV eski zirvesini yapamıyorsa (fiyat yapsa bile) → "klasik
            bearish akış divergence". Fiyat yükseliyor ama hacim baskısı
            içeride zayıflıyor.

          CMF (Chaikin Money Flow, Marc Chaikin, 1980'ler): Daha sofistike.
          Her bardaki "kapanışın bara konumunu" (close-low-high pozisyonu)
          hacimle çarpar, son N (genelde 20) bar boyunca ortalar. -1 ile +1
          arasında gezer.

          • CMF > 0 → para giriyor (alıcı baskısı).
          • CMF < 0 → para çıkıyor (satıcı baskısı).
          • CMF > +0.25 → çok güçlü alıcı baskısı.
          • CMF < -0.25 → çok güçlü satıcı baskısı.

          OBV vs CMF farkları:
          • OBV sınırsız, kümülatif; uzun vadeli akışı gösterir.
          • CMF -1/+1 hapis, periyodik; son N barlık akışı gösterir.
          • OBV trend yönünü erken yakalar; CMF momentum tipinde.

          Akış divergence pratiği:
          1) Klasik bullish akış divergence: Fiyat LL, OBV/CMF HL → tabandan
             dönüş adayı.
          2) Klasik bearish akış divergence: Fiyat HH, OBV/CMF LH → tepeden
             dönüş adayı.
          3) CMF sıfır çizgisi geçişi: trend yönü değişimi sinyali.

          Önemli: Akış indikatörleri trend dönüşlerini fiyattan ÖNCE haber
          verebilir ama her zaman değil. Ek teyit (mum şekli, S/R, trend
          çizgisi) gerekir.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC iki haftadır yeni zirveler yapıyor ($78K, $80K, $82K).
              OBV ise ikinci zirvede eski zirvesini geçemedi, üçüncüde
              daha da geri kaldı. Klasik bearish OBV divergence — alıcı
              baskısı içeride zayıflıyor. Tek başına satış değil; ama
              tepede mum yıldızı + hacim climax + trend çizgisi kırılırsa,
              dönüş senaryosu çoklu teyitle güçlenir.
          - asset: ABD Hissesi
            symbol: AAPL
            scenario: |
              AAPL günlük CMF 6 hafta üst üste +0.20'nin üstünde — sürekli
              kurumsal alım. Fiyat henüz yeni zirveye çıkmadı ama akış pozitif.
              Klasik "akış öncülüğü" senaryosu; fiyat zirvesini daha geç
              yapar. Disiplinli yatırımcı akışı bekler, fiyat onayını sonra
              ekler.
        navigation_link: swell
        navigation_note: "OBV ve CMF, fiyatın altındaki gizli akıntılardır. Yüzeyde dalga küçük olabilir ama akıntı kuvvetliyse rota değişir."
        quiz:
          question: "OBV ile CMF arasındaki temel fark nedir?"
          options:
            - text: "OBV kümülatif (sınırsız), CMF periyodik (-1/+1); OBV uzun vade akışı, CMF kısa-orta vade momentumu gösterir."
              correct: true
              feedback: "Doğru. İkisi farklı zaman ölçeği için tasarlandı."
            - text: "Sadece OBV güvenilirdir."
              correct: false
              feedback: "İkisi de farklı bağlamlarda güvenilir."
            - text: "CMF sadece kripto için çalışır."
              correct: false
              feedback: "Tüm enstrümanlarda çalışır."
        glossary_refs: [obv, cmf, akis-divergence, hacim]

      - id: M9L3
        slug: vwap-disiplini
        title: "VWAP — Kurumsalın Gizli Kontrol Çizgisi"
        learning_objective: "VWAP'in (Volume-Weighted Average Price) ne ölçtüğünü, neden kurumsal trader'ların referans çizgisi olduğunu ve gün-içi vs günlük rolling kullanımını öğrenmek."
        tier_required: premium
        body: |
          Diyelim ki Selin kurumsal bir trader'ın masasında oturuyor. Bütün
          gün ekrandaki tek "yatay-eğri" çizgi VWAP. Niye?

          VWAP (Volume-Weighted Average Price): Bir periyot boyunca işlem
          gören her barı (genelde tipik fiyat × hacim olarak) ağırlıklı
          ortalar. Formül:
          VWAP = Σ(TP × Volume) / Σ(Volume), TP = (H+L+C)/3.

          İki kullanım:

          1) GÜN-İÇİ VWAP (intraday): Borsa açılışında reset edilir, gün
             boyunca devam eder. Kurumsal trader'lar büyük emirleri "VWAP'in
             altında al, üstünde sat" disiplinde dağıtır — çünkü gün sonunda
             ortalama maliyeti yenmek temel görevdir.

          2) ROLLING VWAP (sürekli): Belirli bir periyot (örnek son 20 bar)
             üzerinden kayan ortalama. Günlük/haftalık grafiklerde dinamik
             destek/direnç olarak kullanılır.

          VWAP'in özel anlamı:
          • Fiyat VWAP üstündeyse → günün "ortalama trader'ı" kâr durumda.
          • Fiyat VWAP altındaysa → günün ortalama trader'ı zararda.
          • VWAP'ten sıçramalar dinamik destek/direnç olarak okunur.
          • Trend gün boyu VWAP üstünde kalıyorsa "alıcı baskınlığı"
            güçlü; altında kalıyorsa "satıcı baskınlığı".

          Klasik VWAP kullanımları:
          1) Day trade'de pozisyon yönü: VWAP üstü long bias, altı short bias.
          2) Kurumsal benchmark: "VWAP'i yendim mi?" — büyük emir performansının
             ölçütü.
          3) Mean-reversion: Fiyat VWAP'tan çok uzaklaştıysa (örnek %2+),
             geri çekilme adayı.
          4) Rolling VWAP — günlük grafikte EMA50/200 ile birlikte trend
             onay çizgisi.

          Önemli: VWAP gün-içi sıfırlanır (intraday); haftalık veya aylık
          VWAP de tanımlanabilir ama klasik kullanım intraday'dir. Rolling
          VWAP daha çok modern bir adaptasyondur.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC gün-içi VWAP $79.4K'da. Fiyat sabah $80.2K'a koştu, sonra
              VWAP'e döndü ve oradan tepki verdi. Klasik gün-içi VWAP
              destek tepkisi. Day trader bu seviyeden long pozisyon için
              setup'ı disipline eder.
          - asset: ABD Hissesi
            symbol: SPY
            scenario: |
              SPY gün-içi VWAP $470'te. Fiyat öğleden sonra $468'e indi —
              VWAP altına. Kurumsal alım VWAP altında daha aktif (ucuz);
              gün sonuna kadar fiyat VWAP'e geri dönüş üretirse, klasik
              "kurumsal magnet" senaryosu. Bu pozisyondaki day trader VWAP
              altı uzun-fitilli mumda küçük long düşünebilir.
        navigation_link: harbor
        navigation_note: "VWAP, kurumsalın gizli rota çizgisidir. Günün hava raporu çizgisi gibi — fiyat üstünde yelken doğal, altında bayır yukarı."
        quiz:
          question: "VWAP'in kurumsal trader için en kritik anlamı nedir?"
          options:
            - text: "Büyük emirleri 'VWAP'in altında al, üstünde sat' disipline dağıtmak — ortalama maliyeti yenmek temel görev."
              correct: true
              feedback: "Doğru. VWAP kurumsalın performans ölçütüdür."
            - text: "VWAP otomatik alım/satım sinyali üretir."
              correct: false
              feedback: "Hayır, VWAP referans çizgisidir; karar tek başına vermez."
            - text: "VWAP sadece kripto için çalışır."
              correct: false
              feedback: "VWAP tüm hacimli enstrümanlarda çalışır; kökeni hisse senedi piyasasıdır."
        glossary_refs: [vwap, hacim, kurumsal-akis, dinamik-destek-direnc]

      - id: M9L4
        slug: volume-profile-giris
        title: "Volume Profile — Hafıza Haritası"
        learning_objective: "Volume Profile'ın yapısını (POC, Value Area, Low-Volume Node) ve neden 'fiyatın hafıza haritası' olduğunu anlamak."
        tier_required: premium
        body: |
          Diyelim ki Zeynep grafiğin yanına yatay barlar gördü. Bu Volume Profile —
          "hangi fiyat seviyesinde NE KADAR işlem oldu?" sorusunun cevabı.

          Klasik hacim x-eksende (zaman bazlı). Volume Profile y-eksende
          (fiyat bazlı). Yani bir gün/hafta/ay boyunca, her fiyat seviyesinde
          kümüle olarak ne kadar hacim oldu görsel olarak gösterilir.

          Üç temel kavram:

          1) POC (Point of Control): En yüksek hacmin gerçekleştiği fiyat
             seviyesi. Profilin "kalbi". Bu seviyede en çok karar verilmiş;
             fiyat tekrar buraya gelmek için "magnet" gibi davranır.

          2) Value Area: Toplam hacmin %70'inin gerçekleştiği fiyat aralığı
             (1 standart sapma yaklaşımı). Üst sınırı VAH (Value Area High),
             alt sınırı VAL (Value Area Low). Fiyatın "konfor alanı".

          3) Low-Volume Node (LVN): Çok az hacmin olduğu seviyeler. Boş
             alanlar. Fiyat buralardan hızlı geçer — "vacuum zone" denir.
             Kırılım senaryosunda LVN'lerden geçiş hızlıdır.

          Pratik kullanım:
          1) POC dinamik destek/direnç: Fiyat POC'a yaklaştığında genelde
             tepki üretir. POC kırılırsa, sonraki POC veya VAH/VAL hedef olur.

          2) Value Area Disiplini:
             • Fiyat Value Area içindeyse → yatay yapı; mean-reversion stratejileri.
             • Fiyat Value Area dışına çıkıyorsa → trend stratejileri.
             • Value Area dışında uzun süre kalıyorsa → yeni Value Area oluşuyor.

          3) LVN'den Geçiş: Bir LVN üzerinden fiyat ilerlerse, hızlı hareket
             eder ve genelde bir sonraki HVN (High-Volume Node) noktasında
             durur. LVN'ler kırılımlarda hedef belirleme aracıdır.

          Klasik Volume Profile setup'ları:
          • POC sıçraması: Fiyat POC'a değiyor, mum şekli + hacim teyidi
            varsa tepki adayı.
          • Value Area Breakout: Fiyat VAH üstüne kapanıyor + hacim güçlü
            → bullish breakout.
          • LVN gap: Fiyat LVN içinde hızlanıyor; bir sonraki HVN'ye kadar
            duraksız hareket beklentisi.

          Önemli: Volume Profile periyot seçilebilir (session, daily, weekly,
          composite). Çoklu periyot çakışan POC'lar (örnek günlük POC = haftalık
          POC) çok güçlü seviyelerdir. Profil zamanla evrilir; eski POC etkisini
          yitirir.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC son 30 günlük Volume Profile: POC $75.5K'da, VAH $79K,
              VAL $72K. Fiyat şu an $74K — VAL yakınında. Profil
              gösteriyor ki $72K'da büyük emir birikimi var; oraya tepki
              üretme olasılığı yüksek. Disiplinli trader VAL'e long setup
              + stop VAL altına koyar.
          - asset: ABD Hissesi
            symbol: AAPL
            scenario: |
              AAPL 6 aylık Volume Profile'da POC $182.5'te. Fiyat $190'a
              yükseldi; $182.5 ile $190 arasında belirgin LVN var. Fiyat
              $185 altına dönerse, LVN'den $182.5 POC'a hızla iner — magnet
              etkisi. Stop ve hedef projeksiyonları LVN/POC haritasıyla
              kalibre edilir.
        navigation_link: chart
        navigation_note: "Volume Profile, denizin geçmişteki rota haritasıdır. POC en sık demir atılan liman; LVN'ler boş açık denizler. Fiyat geçmişten öğrenir."
        quiz:
          question: "POC (Point of Control) nedir ve nasıl davranır?"
          options:
            - text: "Profilin en yüksek hacimli seviyesi; fiyat genelde POC'a magnet gibi çekilir ve tepki üretir."
              correct: true
              feedback: "Doğru. POC profilin kalbi, dinamik destek/direnç."
            - text: "Profilin orta noktası (median)."
              correct: false
              feedback: "Hayır; orta nokta median, POC en yüksek hacimdir; farklı yerler olabilir."
            - text: "Trend dönüş noktası."
              correct: false
              feedback: "POC kendi başına dönüş noktası değil; magnet ve dinamik destek/direnç."
        glossary_refs: [volume-profile, poc, value-area, lvn, hvn]
