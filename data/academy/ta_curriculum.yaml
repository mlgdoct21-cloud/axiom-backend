  - id: M8
    slug: trend-volatilite
    title: "Trend & Volatilite — MA Ailesi, MACD, Bollinger, Ichimoku"
    tagline: "Trendi göster, hızını ölç, sınırlarını çiz."
    tier_required: premium
    summary: |
      Trendi göz açıp kapayıncaya kadar gösteren, hızını sayıya çeviren,
      sınırlarını çizen indikatörler ailesi. SMA/EMA ile başlayan klasik
      kuyruk; MACD ile momentumu netleştiren orta sınıf; Bollinger ile
      volatiliteyi banda alan modern köşe taşı; Ichimoku ile beş çizgide
      her şeyi söyleyen Japon mektubu. Bu modülün sonunda bir grafiğe
      bakıp "trend ne, hızı ne, sınır neresi?" sorularını tek bakışta
      yanıtlayabileceksin.
    duration_min: 24
    lessons:

      - id: M8L1
        slug: ma-ailesi
        title: "Hareketli Ortalamalar — SMA, EMA, Golden/Death Cross"
        learning_objective: "SMA ve EMA arasındaki farkı, periyot seçiminin anlamını ve klasik 50/200 cross stratejisini öğrenmek."
        tier_required: premium
        body: |
          Diyelim ki Mehmet bir grafiğe ilk indikatörünü ekliyor: 20 periyotlu
          SMA. Niye? Çünkü hareketli ortalamalar (Moving Average, MA) en eski
          ve en güvenilir trend göstergesidir.

          İki ana tür:
          • SMA (Simple Moving Average): Son N kapanışın aritmetik ortalaması.
            Hesabı en basit; gecikme en yüksek. Ama "düzleştirme" en temiz.
          • EMA (Exponential Moving Average): Son N kapanışı ağırlıklı ortalar
            (yeni veri daha ağır). Gecikme daha az; ama gürültü daha çok.

          Hangi periyot ne anlatır?
          • 10-20 periyot: kısa vade trend (gün-haftalık)
          • 50 periyot: orta vade (haftalık-aylık)
          • 100 periyot: orta-uzun vade
          • 200 periyot: ana trend (yıllık) — "yatırımcı çizgisi"

          MA'nın üç temel kullanımı:
          1) Trend yönü filtresi: Fiyat MA üstünde ise yükseliş eğilimi, altında
             ise düşüş. EMA20 = "kısa rüzgar", EMA200 = "iklim".
          2) Dinamik destek/direnç: Güçlü trendlerde fiyat MA'ya değer ve
             tepki verir. EMA50 popüler "alış yeri" — geri çekilmede dokunup
             yukarı dönen klasik patern.
          3) Kesişim sinyalleri: İki MA'nın kesişimi karar zeminidir.

          Klasik kesişimler:
          • Golden Cross: SMA50 yukarıdan SMA200'ü keser. "Altın haç" — ana
             trend yükselişe döndü işareti. Geleneksel olarak yatırımcı sinyali.
          • Death Cross: SMA50 aşağıdan SMA200'ü keser. "Ölüm haçı" — ana
             trend düşüşe döndü işareti. Risk azaltma sinyali.

          Önemli: MA gecikmelidir. Cross olduğunda hareketin bir kısmı kaçırılmış
          olur. Trader bunu kabul eder; karşılığı "false signal" azlığıdır —
          yatay piyasalarda MA stratejisi zayıftır ama trend piyasalarında güvenilir.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC günlük grafikte EMA20 = $76K, EMA50 = $72K, EMA200 = $65K.
              Sıralama yukarıdan aşağı: 20 > 50 > 200. Bu "tam yükseliş dizilimi" —
              kısa vade kuvvetli, orta vade kuvvetli, ana trend kuvvetli. Bu
              dizilim bozulmadıkça (örnek: 20 aşağıya 50'yi keserse) yükseliş
              hipotezi sağlam.
          - asset: ABD Hissesi
            symbol: AAPL
            scenario: |
              AAPL SMA50 son 6 ayda ilk kez SMA200'ün üzerine çıktı (golden
              cross). Buradan sonraki klasik beklenti: orta vadeli yükseliş
              trendi başlıyor. Kar açma için EMA50'ye dokunma ve tepki bekleyen
              swing trader'lar tipik alım stratejisidir.
        navigation_link: channel
        navigation_note: "MA, geminin uzun yıllık rotasıdır. Kısa MA güncel akıntıyı, uzun MA okyanus akıntısını gösterir; ikisinin sıralaması rotanın sağlığını söyler."
        quiz:
          question: "EMA'nın SMA'ya göre belirgin avantajı nedir?"
          options:
            - text: "Son verilere daha ağır yer verir; trend dönüşlerine daha hızlı tepki verir."
              correct: true
              feedback: "Doğru. EMA gecikmeyi azaltır ama daha gürültülüdür."
            - text: "Daha az gürültü üretir."
              correct: false
              feedback: "Tam tersi; EMA daha gürültülüdür çünkü son veri daha ağırdır."
            - text: "Sadece kripto için çalışır."
              correct: false
              feedback: "Her enstrümanda çalışır."
        glossary_refs: [sma, ema, golden-cross, death-cross]

      - id: M8L2
        slug: macd-okuma
        title: "MACD Okuma — Sinyal Kesişimi, Histogram, Sıfır Çizgisi"
        learning_objective: "MACD'nin üç bileşenini (line, signal, histogram) ayırt etmek; sıfır çizgisinin önemini ve sinyal kesişimlerini doğru yorumlamak."
        tier_required: premium
        body: |
          Diyelim ki Selin grafikte bir alt-panel görüyor: iki çizgi ve renkli
          barlar. Bu MACD (Moving Average Convergence Divergence, Gerald Appel,
          1970'ler).

          MACD üç parçadan oluşur:
          1) MACD line: EMA(12) - EMA(26). İki MA'nın farkı. Pozitif değerler
             yükseliş, negatif değerler düşüş eğilimi.
          2) Signal line: MACD line'ın 9-periyot EMA'sı. Yumuşatılmış versiyon.
          3) Histogram: MACD line - Signal line. Hızı görselleştirir; iki çizgi
             arasındaki mesafe artarken büyüyen yeşil/kırmızı barlar.

          İki kritik yatay çizgi:
          • Sıfır çizgisi: MACD line sıfırın üstündeyse EMA12 > EMA26 →
            kısa vade trend yukarı. Altında ise yukarı. Sıfır çizgisi
            geçişleri "ana yön değişimi" olarak okunur.
          • Signal kesişimi: MACD line, signal line'ı yukarı keserse "bullish
            cross"; aşağı keserse "bearish cross". Cross'un sıfırın altında
            mı üstünde mi olduğu ÖNEMLİ — sıfır altı bullish cross "düşüş içinde
            tepki" sinyali (zayıf), sıfır üstü bullish cross "trend devam"
            sinyali (güçlü).

          Histogram okuma:
          • Histogram büyürken: iki çizgi açılıyor → trend hızlanıyor.
          • Histogram küçülürken: iki çizgi yakınlaşıyor → trend yavaşlıyor.
          • Histogramın sıfıra dönüşü cross'tan ÖNCE gelir — erken uyarı.

          Klasik MACD divergence (M7L4'te bahsedilen):
          • Fiyat yeni zirve yapıyor ama MACD eski zirvesini geçemiyor →
            klasik bearish divergence. Trend yorgun.
          • Fiyat yeni dip yapıyor ama MACD daha sığ dip → klasik bullish
            divergence. Düşüş yorgun.

          Önemli: MACD orta-vadeli (günlük) için iyi çalışır. Çok kısa zaman
          dilimlerinde (1-15 dk) sürekli kesişim üretir ve gürültü yüksektir.
        worked_examples:
          - asset: Kripto
            symbol: ETH
            scenario: |
              ETH günlük MACD sıfır üstünde, signal line'ı yukarı kesti (bullish
              cross). Histogram büyüyor. Klasik "yükseliş trendi içinde momentum
              hızlanıyor" senaryosu. Bu cross güçlüdür çünkü sıfır üstündedir.
          - asset: ABD Hissesi
            symbol: NVDA
            scenario: |
              NVDA günlük MACD sıfır altında, signal line'ı yukarı kesti.
              Klasik "düşüş içinde tepki" senaryosu — zayıf cross. Gerçek
              trend dönüşü için MACD line'ın sıfır çizgisini de yukarı
              geçmesi beklenir.
        navigation_link: swell
        navigation_note: "MACD trendin hız ve yönünü aynı anda söyler. Sıfır çizgisi denizin yüzeyi; üstünde yüzersin, altında dalarsın."
        quiz:
          question: "MACD'de 'sıfır çizgisi üstünde bullish cross' ile 'sıfır altında bullish cross' arasındaki temel fark nedir?"
          options:
            - text: "Sıfır üstü cross trend devam (güçlü); sıfır altı cross düşüş içinde tepki (zayıf)."
              correct: true
              feedback: "Doğru. Cross'un mevkii sinyal kalitesini belirler."
            - text: "İkisi de aynı; fark yok."
              correct: false
              feedback: "Yanlış. Mevkii çok şey değiştirir."
            - text: "Sıfır altı cross daha güçlüdür çünkü 'düşükten dönüş' anlamı taşır."
              correct: false
              feedback: "Tersine, sıfır altı cross genellikle zayıf 'tepki' sinyalidir; trend dönüşü için ek teyit gerekir."
        glossary_refs: [macd, macd-histogram, sifir-cizgisi, signal-line]

      - id: M8L3
        slug: bollinger-bantlari
        title: "Bollinger Bantları — Volatilite, Sıkışma ve Bant Yürüyüşü"
        learning_objective: "Bollinger Bantlarının nasıl oluştuğunu, sıkışma (squeeze) ve bant yürüyüşü (walking the band) örüntülerini tanımak."
        tier_required: premium
        body: |
          Diyelim ki Burak ekrana üç çizgi daha ekledi: bir orta çizgi ve onun
          etrafında iki bant. Bu Bollinger Bands (John Bollinger, 1980'ler) —
          volatilite tabanlı dinamik destek/direnç.

          Yapı:
          • Orta çizgi: 20 periyot SMA.
          • Üst bant: SMA + (2 × standart sapma).
          • Alt bant: SMA - (2 × standart sapma).

          Anahtar mantık: Bantlar fiyatın istatistiksel kararlı dolaşma
          alanını gösterir. ~%95 zamanda fiyat iki bant arasında kalır (normal
          dağılım varsayımı). Bantların dışına çıkmak "olağandışı" hareket
          işaretidir.

          Üç temel örüntü:

          1) SIKIŞMA (Squeeze): Bantlar daralıyor → volatilite düşüyor → enerji
             birikiyor. Piyasa "patlama" öncesi sessizlik. Squeeze ne kadar uzun
             ve dar olursa, sonraki kırılım o kadar büyük olur. Squeeze yön
             göstermez — sadece "yakında büyük hareket" der.

          2) BANT YÜRÜYÜŞÜ (Walking the Band): Güçlü trendlerde fiyat üst veya
             alt banda yapışır ve günlerce orada yürür. Yükseliş trendinde
             üst banda yürüme "trend çok güçlü" — bu "aşırı alım sat" demek
             değildir; tam tersine "trend takip et" demektir.

          3) BANT DIŞI KAPANIŞ + GERİ DÖNÜŞ (Reversal): Fiyat üst banda
             aşırı uzandı, sonra bant dışında kapandı, ertesi mum geri döndü
             → klasik aşırı uzanım/geri çekilme adayı. Yatay piyasalarda en
             iyi çalışır.

          Pratik kombinasyon:
          • Bollinger + RSI: Bant dokunuşu + RSI ekstrem zonu = güçlü teyit.
          • Bollinger + Squeeze: Daralan bant + ADX 15 altında = patlama
            öncesi.
          • Bollinger + Hacim: Bant dışı kapanış + yüksek hacim = trend devam;
            düşük hacim = sahte kırılım adayı.

          Önemli: Bantlar tek başına "fiyat üst bantta, sat" demek değildir.
          Trend yapısı + diğer indikatörlerle birlikte okunur.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC 3 hafta boyunca 4 saatlik grafikte daralan Bollinger içinde
              ($73K-$75K bandında). Bant genişliği son 6 ayın en alt %15
              diliminde — klasik squeeze. Bir sabah büyük yeşil mum üst bandı
              kırdı + hacim ortalamanın 2 katı → bullish breakout adayı.
              Hedef projeksiyon: bant genişliği kadar yukarı (~$77-78K).
          - asset: ABD Hissesi
            symbol: AAPL
            scenario: |
              AAPL bilanço sonrası üst bant dışına çıktı ve 4 gün üst banda
              yapışık yürüdü ("walking the band"). RSI 75-80'de. Klasik
              güçlü trend devamı senaryosu — "aşırı alım sat" yorumu yanıltıcı.
              Pozisyondaki trader trail stop EMA10 altına çekerek devam eder.
        navigation_link: channel
        navigation_note: "Bollinger fiyatın dolaşma kanalıdır. Daralırsa rüzgar düşmüştür; sonraki esinti büyüktür. Bandın dışı ya istisna ya da yeni rota."
        quiz:
          question: "Bollinger 'squeeze' (sıkışma) hangi senaryoyu en doğru ifade eder?"
          options:
            - text: "Bantlar daralıyor; volatilite düşüyor; yakında büyük hareket geliyor (yön belirsiz)."
              correct: true
              feedback: "Doğru. Squeeze enerji birikimidir; yön sinyali değil, hareket sinyalidir."
            - text: "Trend sona eriyor."
              correct: false
              feedback: "Tam tersi; squeeze sonrası genelde yeni trend başlar."
            - text: "Fiyat üst bandın üstünde, satış zamanı."
              correct: false
              feedback: "Bu 'aşırı uzanım' senaryosu; squeeze değil."
        glossary_refs: [bollinger-bandlari, squeeze, walking-the-band, volatilite]

      - id: M8L4
        slug: ichimoku-bulut
        title: "Ichimoku Bulut — Beş Çizgide Tüm Hikaye"
        learning_objective: "Ichimoku'nun beş bileşenini (Tenkan, Kijun, Senkou A/B, Chikou) ve bulut yapısını okumak."
        tier_required: premium
        body: |
          Diyelim ki Zeynep grafiğe Ichimoku ekledi ve karşısında 5 çizgi
          ve renkli bir "bulut" gördü. Görsel karmaşık ama mantık
          olağanüstü zarif.

          Ichimoku Kinko Hyo (Goichi Hosoda, 1969 Japonya): "bir bakışta
          denge tablosu". Tek bir indikatör beş bileşenle trend, momentum,
          destek/direnç ve gecikme onayını aynı anda söyler.

          Beş bileşen:
          1) Tenkan-sen (Çevirme Çizgisi): (En son 9 bardaki HH + LL) / 2.
             Hızlı, kısa vade momentum çizgisi.
          2) Kijun-sen (Standart Çizgi): (Son 26 bardaki HH + LL) / 2.
             Orta vade trend çizgisi. En önemli destek/direnç.
          3) Senkou Span A (Önder Aralık A): (Tenkan + Kijun) / 2, 26 bar
             ileri. Bulutun bir kenarı.
          4) Senkou Span B (Önder Aralık B): (Son 52 bardaki HH + LL) / 2,
             26 bar ileri. Bulutun diğer kenarı.
          5) Chikou Span (Gecikme Çizgisi): Bugünkü kapanış, 26 bar geri.
             Onay çizgisi.

          Bulut (Kumo): Senkou A ile Senkou B arasındaki alan. Yeşilse A > B
          → yükseliş eğilimi geleceğe taşınıyor; kırmızıysa A < B → düşüş
          eğilimi.

          Beş klasik kural:
          1) Fiyat bulutun üstünde → yükseliş yapısı; altındaysa düşüş
             yapısı; içindeyse yatay.
          2) Tenkan, Kijun'u yukarı keserse → momentum bullish cross. Aşağı
             keserse bearish.
          3) Bulut yeşilse (A > B) → trend yapısı yukarı; kırmızıysa
             aşağı.
          4) Chikou Span, 26 bar önceki fiyatın üstündeyse → yapı sağlam.
             Altındaysa zayıf.
          5) Kalın bulut → güçlü destek/direnç; ince bulut → zayıf bariyer.

          "Tam bullish setup" (5/5):
          • Fiyat bulutun üstünde
          • Tenkan > Kijun
          • Bulut yeşil
          • Chikou yukarıda
          • Kalın bulut destekte

          5/5 nadir görülür; çoğunlukla 3/5 veya 4/5 yeterli sinyal sayılır.

          Önemli: Ichimoku yatay piyasalarda gürültülü çalışır. Trend
          piyasalarında muhteşemdir.
        worked_examples:
          - asset: Kripto
            symbol: BTC
            scenario: |
              BTC günlük: fiyat bulutun üstünde, Tenkan Kijun'u 2 hafta
              önce yukarı kesti, bulut yeşil, Chikou 26 bar önceki fiyatın
              üstünde, kalın bulut destek. Klasik "tam bullish setup".
              Trend takip pozisyonu için Ichimoku güçlü teyit.
          - asset: ABD Hissesi
            symbol: SPY
            scenario: |
              SPY günlük: fiyat bulutun içinde — yatay yapı. Tenkan ve Kijun
              yatay. Klasik "kararsızlık" — Ichimoku yön söylemiyor. Bu
              durumda strateji "buluttan çıkışı bekle" disiplinindedir;
              içeride agresif pozisyon riskli.
        navigation_link: chart
        navigation_note: "Ichimoku haritanın tüm bilgilerini bir karede sunan Japon mektubudur — geçmiş, şimdi, gelecek; trend, momentum, destek. Karmaşık görünür ama tek bakışta hikayeyi anlatır."
        quiz:
          question: "Ichimoku'da fiyat 'bulutun içinde' hareket ediyorsa temel yorum nedir?"
          options:
            - text: "Kararsızlık / yatay yapı; trend takip stratejileri için zayıf zemin."
              correct: true
              feedback: "Doğru. Bulut içi 'belirsizlik bölgesi'dir; çıkış beklenir."
            - text: "Güçlü yükseliş başlıyor."
              correct: false
              feedback: "Yükseliş için fiyatın bulutun üstüne çıkıp orada kalması beklenir."
            - text: "Trend dönüşü kesin."
              correct: false
              feedback: "Bulut içi 'dönüş kesin' demek değil; sadece 'şu an net trend yok' demektir."
        glossary_refs: [ichimoku, tenkan, kijun, senkou-a, senkou-b, chikou, kumo]

