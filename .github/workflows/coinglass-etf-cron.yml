name: CoinGlass ETF flow cron

on:
  schedule:
    # 06:00 UTC (~09:00 TR, after CoinGlass overnight finalization)
    # 18:00 UTC (~21:00 TR, after US market close)
    - cron: "0 6,18 * * *"
  workflow_dispatch: {}

jobs:
  scrape-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install playwright httpx

      - name: Install Chromium
        run: python -m playwright install --with-deps chromium

      - name: Scrape CoinGlass and push to backend
        env:
          AXIOM_BACKEND_URL: ${{ secrets.AXIOM_BACKEND_URL }}
          BOT_INTERNAL_SECRET: ${{ secrets.BOT_INTERNAL_SECRET }}
        run: python scripts/scrape_coinglass_etf.py
